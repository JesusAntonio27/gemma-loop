        - "prereg.yaml engine_gate.status, runs_after_tag, repair_cycle, engine_pin_rule"
        - "prereg.yaml part_b.status"
        - "prereg.yaml pins.padded_engine_source"
        - "PREREGISTRATION.md sections 2.3, 4.3, 10, 11"
      why: >-
        The current documents still conditionally authorized a refill engine
        and described a repaired smoke as if it ran.  Both are false for this
        preregistration and contradict the registered padded engine.
      uses_outcome: false
      outcome_basis: >-
        No trained-arm outcome: an execution-engine and provenance correction
        based on the recorded smoke/review history.
    R8C-02:
      id: R8C-02
      title: "Realized corpus counts and shortfall rules frozen before the first trained-arm score"
      changes: >-
        Marked every hash split count as nominal and recorded the realized
        counts from the frozen pool split files (train 2,488 / 2,424 after the
        64 MONITOR ids; P1 58 -> deterministic first 50; T-fit 86; selection
        152; NLL fit 90; NLL test 396; with math subcounts).  Registered P1 as
        200 attempts (50 x 4) with a deterministic ascending
        sha256(0:request_id) truncation and a fixed retained-row rule.
        Registered the pilot fit/selection IDs and domain: math-only until
        code is verified in the Docker sandbox; code eligibility may not change
        after any preliminary math-only ranking.  That math-only clause is
        HISTORICAL ONLY: round 8e supersedes it with math plus code passing the
        frozen Docker verifier (chat never), so the round-8c clause is not
        operative beside the round-8e rule.  Added fail-closed minima
        (P1 20 verified problems as a descriptive label, never a P2 gate;
        T-fit 20; selection 30; MONITOR 32 usable rows; D1 fit 20 and score
        40), the no-borrowing/no-regeneration rule,
        zero-RL-prompt and insufficient Stage 1/RFT token branches, and the
        requirement to keep all 64 MONITOR IDs reserved even when traces fail.
        Named the dedicated D1 60-69 post-tag, pre-pilot sampling obligation:
        the registered Stage 0 data sampler (Modal vLLM when approved, else the
        local padded engine), four samples per problem, max_new_tokens 32768,
        the 8192 rendered-length filter, with trace IDs/outcomes/counts frozen
        in prereg-v1-data before any trained-arm score.
      where:
        - "prereg.yaml data.splits.nominal_counts_role, realized_counts, train_problems_role, shortfall_rules"
        - "prereg.yaml pilot.p1.row_definition, truncation_rule, retained_row_rule, domain_rule, min_verified_problems, shortfall_rule"
        - "prereg.yaml pilot.p2.domain_and_freeze, shortfall_rule"
        - "prereg.yaml stage1.dose_shortfall_rule"
        - "prereg.yaml stage2.prompt_shortfall_rule"
        - "prereg.yaml monitor.minimum_rows, missing_arm_rule"
        - "prereg.yaml endpoints.nll_analysis.unevaluable_corpus"
        - "PREREGISTRATION.md sections 3.3, 4.2, 5, 6.2b, 6.3, 11"
      why: >-
        X1 requires the realized corpus and every shortfall rule to be frozen
        before the first trained-arm score, distinguishing attempts from
        retained rows and preventing post-result borrowing, regeneration or
        code-domain changes.
      uses_outcome: false
      outcome_basis: >-
        No trained-arm outcome: counts come from the frozen Stage 0 pool split
        files, not from any trained arm.
    R8C-03:
      id: R8C-03
      title: "Monitor abort/resume and missing-arm policy completed"
      changes: >-
        Registered that an ABORT writes NO checkpoint and leaves the last
        COMPLETE checkpoint intact; required --ack-abort on every registered
        resume path (orchestrator, pilot harness, train.py --resume): without
        it a registered resume over an abort record exits 2, and with it the
        run resumes from the last COMPLETE checkpoint if one exists, otherwise
        the partial run directory is archived and the same run restarts from
        zero.  Limited what acknowledgement permits; distinguished a technical
        repair from a recipe-changing new version; fixed the probe cadence
        (500k interval and train end), probe N sets and the two-half
        temperature fit, and deferred the exact probe token points plus the
        generation-sanity length-truncation exception to round 8d instead of
        hand-computing them from the implementation; and required aborted or
        incomplete arms to be reported as such, never replaced by an informal
        experiment, shorter dose, earlier checkpoint or survivor selection.
        Corrected the hinge WARN rule from tokens to rows.
      where:
        - "prereg.yaml monitor.abort_terminal, resume_rule, repair_rule, probe_configuration, probe_failure_rule, missing_arm_rule, warn_effect, warn_rules"
        - "PREREGISTRATION.md section 4.2 and the round-8b/8c changelog"
      why: >-
        The round-8b text saved a checkpoint on ABORT and left the resume path
        underspecified; the code writes no checkpoint and requires
        acknowledgement.  A missing teacher cell makes the registered
        comparison unevaluable rather than a licence to select survivors.
      uses_outcome: false
      outcome_basis: >-
        No trained-arm outcome: execution-safety wording and the recorded
        implementation contract.
    R8C-04:
      id: R8C-04
      title: "Temperature-fit estimator and teacher-qualification timing bound"
