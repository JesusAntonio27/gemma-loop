revision_round8e:
  title: "Revision round 8e (pilot shortfall amendment)"
  date: "2026-11-06"
  stage_a_exposure: >-
    Stage A was exposed before this round (section 0.1 and the round-8b
    record).  Every round-8e change is therefore a pre-tag technical amendment
