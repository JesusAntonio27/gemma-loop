# ---------------------------------------------------------------------------
# Part 2: exploratory iteration (rules only)
# ---------------------------------------------------------------------------

part2:
  starting_checkpoint: L-s0
  also: O-H-s0 where cheap
  versioned_checkpoints: true
  lineage: true
  techniques:
    - >-
      Sequence-level (black-box) distillation from DeepSeek V4.1 Flash via the
      official API: verification-filtered, length-controlled, mixed with the
      model's own verified traces.
    - >-
      RL judged by DeepSeek with rubric templates, plus automatic checks where
      they exist (unit tests, exact answers; controller's recommendation per
      Ruling 359).
    - Author's blind hand ratings of creative outputs at every checkpoint.
    - A detached learned exit gate (Ouro stage-II labels; a 1536->1 probe on stored features from the D4 forward, LM frozen).
    - Gate-only RL for the router with a compute penalty (LM frozen; credit assignment stays clean).
    - Adaptive decoding with per-row N in the refill engine (masked or gathered active rows; the KV cache is untouched).
    - An exit-1 entropy gate and the D4 winning adaptive policy as the `auto` serve level.
    - Effort-level serving low/medium/high/max/auto (low=N=1=O exactly, medium=N=2, high=N=4, max=N=8, auto=the D4 winner).
    - Span-subsampled exits (coda and head on a random 2,048-token span; legal because consumers are token-independent).
    - A warm-up adapter (adapter A on pass 2, adapter B shared from pass 3) or a clamped pass embedding; neither is in Part 1.
    - >-
      A precision-matched 4-bit byte frontier: O-E2B and L-E2B with 4-bit
      block weights (LoRA bf16) versus E4B 4-bit (QAT or nf4) at matched
      resident bytes, including whether the dial survives quantization because
      the block's quantization error is re-applied on every pass.
    - Agentic RL in OpenCode.
    - Checkpoint and LoRA merging.
  rules:
    - Decisions are made only on dev sets.
    - Held-out test benchmarks are frozen and scored only at named milestones.
    - Every iteration is logged (data, technique, results including failures).
    - Results are reported as development, never as Part 1 confirmatory claims.
    - A judge is never the sole evaluator of anything it trained.
    - OpenCode-hosted endpoints are never used for data or results.
  serve_map: >-
    low = N1 (O exactly), medium = N2, high = N4, max = N8, auto = the D4
    winning adaptive policy.  This is a new control axis beside enable_thinking.
  milestones:
    - end of Part 1 seed-0 pair
    - first exploratory checkpoint that improves the dev composite
    - >-
      adaptive-decode accuracy: measure the registered adaptive policies
      end-to-end (accuracy, calibrated NLL, analytic and executed bytes read per
      token, latency) against fixed N at matched analytic FLOPs, before claiming
      any adaptive-decode result
    - final checkpoint of the Part 2 iteration
  dev_composite: >-
    Mean dev pass@1 on code and math; creative ratings are reported separately
    and are not folded into the composite.
  milestone_scoring_cap: >-
    Held-out benchmarks are scored at most at the four named milestones
    (including adaptive-decode accuracy, which does score held-out benchmarks);
    no other held-out scoring is allowed.
  automatic_checks_note: >-
    Automatic checks where they exist are the controller's recommendation,
    adopted in Ruling 359; they are used alongside the judge, never as a
    replacement for the author's blind ratings.
  decision_log_export: "docs/prereg-v1-decision-log.md at the tag"
  deepseek_terms: >-
    DeepSeek Open Platform terms section 4.2(3) allow distillation training and
    section 4.2(2) assigns output rights to the user (effective 2026-04-29).
    OpenCode Zen free usage is only for plumbing or dry-run tests whose outputs
    are discarded.

