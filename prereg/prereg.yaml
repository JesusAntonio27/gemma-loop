    - R8C-08
  items:
    R8C-01:
      id: R8C-01
      title: "Padded is the sole operative Part 1 engine in both documents"
      changes: >-
        Rewrote PREREGISTRATION.md sections 2.3 and 4.3 (and the related
        claims) to register the padded adaptive-batch HF engine unconditionally
        for Stage 2 and all evaluation, removed every conditional refill
        authorization, and marked engine_gate and part_b INACTIVE with no
        execution authority.  Corrected the smoke record: four old smoke
        attempts; the one bounded repair developed gate v6 on fix/gate-v6
        (head 8f36acad8abda3dd099e3589539844587c9f93cc); native review rejected v6 (C1-C3); the repaired smoke
