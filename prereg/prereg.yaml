# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------

data:
  sampling_model: O
  sampling:
    temperature: 1.0
    top_p: 0.95
    top_k: 64
    max_new_tokens: 32768
    enable_thinking: true
  pool:
    code_count: 2000
    math_count: 2000
    chat_count: 1000
    samples_per_prompt: 4
    generated_tokens: 64000000
    # Round 8b: the realised Part-1 pool mode.  Part 1 does not need the Part 2
    # creative eval briefs; when those briefs are written, they are
    # decontaminated against this pool in the reverse direction.
    mode: "part1"
    part1_creative_briefs: false
    part1_mode: >-
      Part-1 mode: 5,000 problems (2,000 code, 1,000 chat, 2,000 math), built
      without the Part 2 creative eval briefs.  This is an explicit builder
      mode recorded in the manifest, not a smoke flag.  When the Part 2 briefs
      are written they are decontaminated against the frozen pool in the
      reverse direction.
    manifest_sha256: "70053b90fa631fda1e5e0fa77a932e30c4bab80e81ef136f2330adf0daaef84e"
    code_sources:
      - TACO
      - APPS
      - CodeContests pre-2023-05
    math_sources:
      - OMR
      - DAPO-17k
      - DeepScaleR
    chat_sources:
      - "existing decontaminated chat source (data-length-audit.md)"
    # Round 8b: the source fixes merged at dfea02a.  The reader, not only the
    # dataset name, is pinned because the previous readers selected the wrong
    # parquet files / solution column.
    source_pins:
      APPS: >-
        codeparrot/apps at refs/convert/parquet
        0f10e424e13e1c2a69f851e153097b71b6734a1f (source commit
        21e74ddf8de1a21436da12e3e653065c5213e9d1); all/train/0000.parquet,
        5,000 rows.
      TACO: >-
        BAAI/TACO at d593ed0a2becbbc952230bb89be09189bf1056dc; the
        ALL/train-*.parquet files (25,443 rows), no mirror.
      CodeContests: >-
        deepmind/code_contests at 802411c3010cb00d1b05bad57ca77365a3c699d6;
        the pre_2023_05 window, Python-only reference solutions.
  decontamination:
    - 13-gram overlap
    - "Indel >= 0.75"
  decontamination_targets:
    - LiveCodeBench release_v6
    - GPQA Diamond
    - AIME 2026
    - MMLU-Pro
    - MMMU-Pro
    - MATH-Vision
    - SpatialEval
    - CV-Bench 2D
  manifest_sha256: null
  manifest_addendum: >-
    The realised manifest SHA-256 is frozen in the post-tag prereg-v1-data
    addendum, committed before the pilot.  The same addendum records the Stage 2
    prompt-cap accounting: how many prompts the 2,048-token cap excludes and its
    interaction with the 1,600-prompt cycling rule.  Any change is a new prereg
    version and is reported.
  splits:
    split_rule: >-
      bucket = int(sha256(problem_id), 16) % 100, seed 0; buckets are disjoint
      by problem id and are assigned once.
    train_bucket: "0-49"
    pilot_dev_bucket: "50-59"
    nll_kl_bucket: "60-69"
    post_tfit_bucket: "60-61"
    nll_test_bucket: "62-69"
    long_traces_bucket: "70-79"
    heldout_test_bucket: "80-99"
    pilot_p3_bucket: "50-53"
    pilot_selection_bucket: "54-56"
    pilot_tfit_bucket: "57-58"
    pilot_p1_bucket: "59"
    stage0_prompt_bucket: "0-49"
    # Round 8b: the dedicated heal MONITOR corpus.  The 64 train-bucket
    # problems with the largest sha256(seed:problem_id) keys, one sample each;
    # every training subset takes the smallest keys and excludes these.
    monitor_bucket: "0-49"
    monitor_problems: 64
    monitor_samples_per_prompt: 1
    monitor_order_rule: >-
      order_key = sha256(seed:problem_id); the MONITOR set is the 64 largest
      keys in train bucket 0-49 and every training subset takes the smallest
      keys.  Selection is by problem hash, never by a model output.
    train_problems: 2500
    pilot_dev_problems: 500
    # Round 8c: hash counts are nominal; the realized counts below come from
    # the frozen pool split files.  train_problems 2500 is the nominal
    # pre-carve target, not the realized training corpus.
    nominal_counts_role: >-
      The per-bucket problem numbers above are nominal hash expectations.  The
      realized counts are those of the frozen Stage 0 pool split files and are
      recorded in realized_counts; they are input counts, not trained-arm
      outcomes.
    realized_counts:
      train: 2488
      train_after_monitor: 2424
      train_math: 1023
      train_math_after_monitor: 994
      pilot_dev: 506
      pilot_p1: 58
      pilot_p1_selected: 50
      pilot_p1_selected_math: 23
      pilot_p1_selected_code: 19
      pilot_p1_selected_chat: 8
      pilot_tfit: 86
      pilot_tfit_math: 29
      pilot_selection: 152
      pilot_selection_math: 62
      pilot_p3: 210
      nll_fit: 90
      nll_fit_math: 40
      nll_test: 396
      nll_test_math: 162
      long_traces: 507
      heldout_test: 1013
    train_problems_role: >-
      2500 is the nominal pre-carve target.  split_train.jsonl has 2488
      realized rows; excluding the 64 MONITOR ids leaves 2424 usable training
      problems (994 math, 924 code, 506 chat).  The shortfall is not refilled:
      Stage 1/2 cycle the frozen row order to the registered dose, and a
      zero-row corpus stops before training (folded into shortfall_rules).
    shortfall_rules: >-
      Realized corpus shortfalls never authorize borrowing another split,
      regenerating until favorable, relaxing a filter or verifier, or an
      unregistered extra epoch.  P1: 200 attempts (50 x 4) are retained only
      under pilot.p1.retained_row_rule; P1 is descriptive for every count and
      never gates P2 (fewer than 20 verified problems is small-sample
      descriptive; zero is unevaluable).  T-fit/selection: complete the
      original per-request accounting, then apply the single conditional
      four-attempt extension per original math/code problem when nT0<20 or
      nS0<30; P2 runs only if final T-fit>=20 AND selection>=30 distinct
      verified problems, else the pilot is unevaluable and P2 does not run.
      There is no second batch, lower minimum, relaxed filter, borrowed bucket
      or domain substitution.  MONITOR: all 64 problem IDs stay reserved; at
      least 32 usable rows are required, else stop before training.  D1: a
      usable fit corpus needs at least 20 verified distinct problems and the
      score corpus at least 40, else D1 is unevaluable with no alpha transfer.
      Stage 1/RFT and Stage 2 cycle a non-empty frozen row/prompt set to the
      registered dose; zero usable rows or prompts stops and requires a new
      disclosed version.
    pilot_p3_problems: 200
    pilot_selection_problems: 150
    pilot_tfit_problems: 100
    pilot_p1_problems: 50
    nll_kl_problems: 500
    post_tfit_problems: 100
    nll_test_problems: 400
    long_traces: 500
    heldout_test_problems: 1000
  # Stage 1, pilot heals and RFT only; Stage 2 rows (<= 10,240 tokens) are
  # not filtered by max_length.
  max_length: 8192
  length_mode: filter
  stage0_sample_filter: >-
    Keep a Stage-0 sample only if finish_reason = stop, the thought channel is
    closed, the final answer is non-empty, and the rendered length is <= 8192.
    The reasoning share of code + math tokens must stay >= 75 %.
  reasoning_share_min: 0.75

# ---------------------------------------------------------------------------
# Heal monitoring (round 8b): execution safety only, never a selection input.
# ---------------------------------------------------------------------------

monitor:
  role: >-
    Observe-only execution safety.  Monitoring never changes a run except
    through the registered aborts and never feeds pilot selection, eligibility,
    STOP or any confirmatory endpoint.
  corpus: >-
    The MONITOR corpus is the 64 train-bucket (0-49) problems with the largest
    registered order keys sha256(seed:problem_id), one sample per problem,
    selected by problem hash before any heal and excluded from every training
    subset and every training file.  Its problem ids are written to the monitor
    manifest; it is not a held-out benchmark and is never scored as one.
  split_rule: >-
    monitor_problem_ids = the 64 largest sha256(0:problem_id) keys in bucket
    0-49.  The train target sorts by the smallest keys and skips every monitor
    id, so the MONITOR set is disjoint from the Stage 1/2 train rows at the
    problem level.  Problem ids are compared canonically (the same
    'dapo:<sha256>' mapping as the Stage 0 pool).
  training_exclusion: >-
    The monitor ids never enter the training corpus, the heal statistics or
    heal/train.jsonl; every training subset takes the smallest order keys and
    excludes them.  The registered pilot T-fit split (57-58) is untouched.
  teacher_shards: >-
    The pilot precomputes teacher top-k+tail shards for the 64 monitor rows
    with the same frozen teacher runtime, manifest identity and max_length
    (8192) as the arm, and passes them as --monitor-teacher-data.  The probe
    fit half therefore uses the MONITOR teacher, never the training collator.
    A shard whose row-id alignment or manifest identity does not match fails
    closed before training.
  abort_rules:
    - "any non-finite loss, gradient or logit"
    - "exit-1 bit-exactness failure versus adapter-off O on the fixed probe batch"
    - "teacher-data integrity failure: renormalised sums off by more than 2e-3, or wrong shapes/ids"
    - "parent KL at the primary N above 1.0 nat/token for 3 consecutive probes"
  warn_rules:
    - "loss spike > 3x the rolling median for 20 consecutive steps"
    - "gradient norm > 10x its rolling median"
    - "teacher KL improves by < 5 % over the last 1M tokens (stall)"
    - "hinge active on > 50 % of rows after the first 1M tokens (the implementation computes a per-row mean; this is a row rule, not a token rule)"
    - "monitor/train teacher-KL gap growing for 3 consecutive probes (overfitting)"
    - "generation-sanity (N <= 4): WARN on repetition loops; WARN on a missing answer or an open thinking channel only when the generation stopped before the 512-token completion cap (finish_reason != 'length'). A length-truncated thinking trace is expected and is not a sanity failure. Repetition loops warn regardless of finish_reason."
    - "bridge g saturation (> 10 % of channels at |g| > 0.5) or all-zero g after 1M tokens"
    - "memory within 0.3 GiB of the allocator cap"
    - "tokens/s below 50 % of the post-warm-up median"
  abort_exit_code: 76
  abort_terminal: >-
    An ABORT writes NO checkpoint, writes alerts.json and exits 76; the last
    COMPLETE checkpoint stays intact and is the only resume point.  The
    orchestrator treats exit 76 as terminal and will not restart the arm on its
    own.
  resume_rule: >-
    A run stopped by an ABORT resumes only with an explicit --ack-abort
    <alert-id>, recorded in run.json and copied to orchestrator.jsonl and
    status.json.  Every registered resume entry path (the orchestrator, the
    pilot harness and train.py --resume) must require and record
    --ack-abort; a registered resume without --ack-abort <id> over a run whose
    abort record exists exits 2.  With the acknowledgement, if a COMPLETE
    checkpoint exists resume from the last COMPLETE checkpoint; otherwise
    archive the partial run directory and restart from zero.  Either path keeps
    the SAME registered run with the same data, dose, thresholds, seeds and
    recipe.  The acknowledgement does not authorize changing the dose, N mix,
    thresholds, source rows or seeds, and it does not authorize rerunning
    unchanged seeds until an attractive checkpoint appears.
  repair_rule: >-
    A technical repair may restore the registered implementation (for example
    a crash, a stale monitor state, a row-rendering or resume bug) without
    changing data, dose, thresholds, seeds, model, estimator or selection
    rule; the repair and its commit are disclosed before the run resumes.  Any
    recipe-changing fix (dose, N mix, thresholds, source rows, teacher
    runtime, estimator, selection rule, or the endpoint) is a new disclosed
    prereg version, not an in-run repair, and is never accepted merely to keep
    a curve.
  probe_failure_rule: >-
    A probe exception is caught and recorded as a WARN row (ok=False) while the
    run continues; two consecutive probe failures are an ABORT (exit 76).
  probe_configuration: >-
    Fixed probe settings: an interval probe at the first optimizer-step
    boundary where tokens_seen - last_probe_tokens >= 500,000, with
    last_probe_tokens advancing after every probe; a train-end probe when
    tokens_seen > last_probe_tokens (that is, when tokens advanced since the
    last probe); never inserted at synthetic positions.  At the registered
    3M-token pilot dose and the ~26k-token optimizer step the interval is
    ~19.2 steps, so the achieved interval probes are 0.52M, 1.04M, 1.56M,
    2.08M and 2.60M tokens (the 20th, 40th, 60th, 80th and 100th step), plus
    one train-end probe at ~3.00M tokens when the incomplete next 500k window
    has advanced the count.  Deterministic 32-row MONITOR fit/score halves;
    anchor N = 2,3,4,6,8; NLL N = 1,2,3,4; generation N = 1,2,4 (8 greedy
    prompts, 512 new tokens, batch 4); temperature candidates 0.5, 0.75, 1.0,
    1.5, 2.0, 3.0, 4.0 fitted per checkpoint and N on one half and scored on
    the other.  The pilot T-fit split is never touched.  The 500,000-token
    interval plus the train-end probe is the registered cadence; the token
    points above are that schedule at the registered dose and step.
  minimum_rows: 32
  missing_arm_rule: >-
    All 64 selected MONITOR problem IDs stay reserved even when individual
    traces fail the filter.  At least 32 usable MONITOR rows are required; a
    smaller usable set stops before training (fail-closed) and is never
    refilled after observing student metrics.  An aborted or incomplete
    teacher/arm cell is reported as aborted or incomplete: it is not replaced
    by an informal experiment, a shorter dose, an earlier checkpoint or a
    comparison among survivors.  A missing cell in the four-cell teacher
    statistic makes that comparison pending/unevaluable, not a winner.
  warn_effect: >-
    A WARN alone never changes training, selection, eligibility or resume
    behavior; only a registered ABORT does.
  reserved_ids_contract: >-
    reserved_ids.json is a problem-id split map with the keys monitor,
    pilot_eval, pilot_fit, heal_train, confirmatory and any extra keys.  The
    monitor proves monitor INTERSECT (every other key UNION the training rows)
    = empty and never treats its own monitor key as an overlap; rendered-row
    hashes live under content_hashes (metadata), not in the id lists.  A
    missing, unreadable or overlapping map exits 2 before training.
  report_rule: >-
    Live and final reports are descriptive; heal_report.py --watch re-renders
    every five minutes and the traffic-light summary never changes a run.
    Monitoring off installs no callback and reproduces training bit-exactly.

# ---------------------------------------------------------------------------
# Grading (round 8b): math verifier and sandboxed code verification.
# ---------------------------------------------------------------------------

grading:
  math_verify_version: "math-verify 0.9.0 (antlr4 4.13.2)"
  math_verify_internal_timeouts: "disabled (parsing_timeout=None, timeout_seconds=None)"
  math_verify_outer_timeout_s: 10.0
  math_rule: >-
    A math answer is correct iff math-verify 0.9.0 says correct OR the
    registered AIME/integer normalisation says correct.  math-verify runs in a
    grading subprocess with its internal timeouts disabled and a 10 s outer
    timeout; the normaliser still votes if that outer timeout fires.
  math_why: >-
    math-verify's own timeout uses multiprocessing spawn, which fails on
    Windows, so the outer subprocess timeout is the registered guard.  The two
    verifiers also disagree on '\boxed{1,234}' versus '1234'; with the OR rule
    a definitive math-verify False cannot override a normaliser match, and
    decided_by records which verifier decided (math_verify, normaliser, both or
    timeout).
  decided_by: "decided_by is recorded per graded sample as math_verify, normaliser, both or timeout"
  code_sandbox: "Docker, CPU-only, --network none; the stdout/stdin reference-solution grader"
  code_rule: >-
    Code samples for the verified pilot targets (P1, T-fit and selection) are
    graded with the frozen Docker verifier before any pilot evaluation.  The
    existing source tests and the frozen extraction/wrapper/comparison
    implementation run only inside that sandbox; the full nonempty frozen test
    set must pass with sandboxed=true.
  unsandboxed_rule: >-
    The unsandboxed local mode is never used for model-generated code.  There
    is no math-only fallback for a required frozen verifier: without it,
    code is unverified, is not a verified target and the official count is not
    accepted.  No target is silently relabelled verified.
  dependency: >-
    Verified pilot targets depend on the frozen Docker code verifier; math
    verification is local under the rule above.  Infrastructure errors are
    rerun only with identical input bytes and the identical frozen
    configuration, never with changed limits or a favorable rerun.

# ---------------------------------------------------------------------------
# External APIs (round 8b): DeepSeek, NVIDIA NIM and OpenCode rules.
# ---------------------------------------------------------------------------

external_apis:
  deepseek_api: "official DeepSeek Open Platform API only; no third-party gateway"
  deepseek_model: "deepseek-flash (never deepseek-v4-pro)"
  deepseek_served_version: "DeepSeek-V4.1-Flash-1017"
  deepseek_off_peak: >-
    All DeepSeek use is off-peak only, enforced in code with no override.
  deepseek_peak_windows: "01:00-04:00 and 06:00-10:00 UTC, Monday-Friday"
  deepseek_margins: "15 minutes before each peak window and 5 minutes after it"
  deepseek_paid_pilot_max_items: 20
  deepseek_writer_hard_cap_items: 50
  deepseek_waste_stop: >-
    Stop the run when at least 3 of the last 20 paid responses are waste
    (finish_reason=length or empty content); the trip is journaled and a reuse
    needs an explicit --ack-waste-trip.
  deepseek_fingerprint: >-
    One registered system_fingerprint record for the project
    (artifacts/stage0/deepseek_fingerprint.json); every response must match the
    exact served model and that fingerprint, and a deliberate --repin is the
    only way to change it.
  deepseek_phase_approval: >-
    Every phase needs the author's explicit approval; the author tops up only
    that phase's amount.  The registered paid pilot is 20 items and runs before
    any full run; a continuation is refused when the projected cost exceeds the
    phase cap.  The writer's code-level --pilot hard upper bound is 50
    (PILOT_MAX_ITEMS), but 50 is a guard, not a registered paid-run size and
    never authorizes more than 20 registered pilot items.
  deepseek_budgets:
    phase1_hidden_tests: "cap $5"
    stage2_rollout_audit: "cap $5"
    part2_briefs_agent_tasks: "cap $3"
    creative_judge: "cap $8"
    opencode_trajectories: "cap $30 (or 300 tasks, cap $15)"
    rubric_rl_arm: "cap $20"
  deepseek_project_expected_usd: "~$40-50 expected for the whole project"
  deepseek_caps_sum_usd: 71.0
  nvidia_nim: >-
    The NVIDIA NIM API trial is NOT usable for anything that enters training,
    judgments, hidden tests or the published dossier.  Only plumbing tests
    whose outputs are discarded, never committed, are allowed.  Part 1 is
    unaffected because it uses local Gemma teachers only.
  nvidia_nim_terms: >-
    NVIDIA API Trial ToS dated 2025-10-07: s1.2/1.4 trial use is internal
    testing/evaluation only; s4.2 no distribution of Generated Content; s4.4
    no derivative works of any part of the API Service (models included);
    s4.12 no use of Generated Content to develop competing products.  A
    permissive model license does not override these contract terms.
  opencode_endpoints: >-
    OpenCode-hosted endpoints are never used for training data, judgments,
    hidden tests or results; only plumbing or dry-run tests whose outputs are
    discarded.

