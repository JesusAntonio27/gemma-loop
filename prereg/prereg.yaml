  stream_diagnostic: >-
    Stream diagnostic of 11:00-11:07 (engine_gate/stream_diag.json): no
    refill sampling-stream bug signature.  Per-request canonical-replay
    mismatch totals were O 12/16/14 and L 15-29 gch N=2 21/16/24 for padded /
    refill / control respectively, far from the 6-20-per-request signature of a
    one-draw stream bug; the anomalous request lcb-04 shows refill 3 (O) / 2
    (L) vs 0 for padded and control, small and consistent with filter-boundary
    flips.  The gate then traced the same SHA-256 request seeds, one full-vocab
    draw per row per step, draw survival across re-prefill/compaction/late
    admission, retry-state restoration and the
    temperature->top-k->top-p->Gumbel order; the remaining problem is the
    measurement (one canonical forward ignores the engine, and replayed
    discontinuous top-k/top-p masks can turn a 0.004-logit change into a
    ~3-logit apparent gap) plus a miscalibrated 0.25 threshold.
  replacement_rule: >-
    Engine gate v6 (frozen before collecting replacement evidence).  Use one
    clearly named canonical reference per shared prefix and compute its
    diagnostics identically for padded-vs-refill and padded-vs-padded control;
    never label a canonical result as an engine-specific margin.  Greedy:
    chosen-token regret D = max(max(c) - c[a], max(c) - c[b]) on the canonical
    logits c, with padded choice a and comparison choice b;
    tau_g = max(0.25, maximum calibration-control D + 0.0625); if calibration
    has no divergences use 0.25; if tau_g > 0.50 the key is
    inconclusive/ineligible rather than clipped into a pass.  Every greedy
    refill divergence must satisfy D <= tau_g and the validation control must
    be consistent with the envelope.  Sampled: record compact decision traces
    (request id, prefix hash, position, round/local step, generator
    device/dtype, draw count and noise fingerprint, actual raw candidate
    logits, top-k cutoff/ties, nucleus membership and cumulative cutoffs,
    Gumbel scores, EOS/budget decisions) and reconstruct each recorded choice
    from its actual scores, support and request noise.  Argmax mismatch,
    draw-count/state mismatch, wrong id/seed, malformed or missing trace is a
    HARD FAIL with no numerical excuse.  Stable support uses the same
    chosen-token regret construction on canonical temperature-scaled, filtered,
    Gumbel-perturbed scores with the same 0.25 floor, 0.0625 slack and 0.50
    ceiling.  Changed support uses a boundary certificate: the changed token is
    at the actual top-k/top-p boundary, the raw perturbation is within the
    independent control envelope, and the filtered distributions stay within
    a registered distance bound.  For either statistic X, the envelope is
    X_refill <= 2 * max_calibration_control_X + slack_X, with slack_raw = 0.05
    logits and an absolute raw ceiling of 0.50 logits, and slack_TV = 0.005 and
    an absolute TV ceiling of 0.10; raw X is the maximum absolute
    post-softcap, pre-temperature score change on the union of relevant and
    mask-boundary candidates, TV is half the L1 distance between the two
    complete filtered probability vectors (masked tokens = 0).  Compute the
    same quantities for the validation control and require both relative and
    absolute ceilings; if calibration is already above a ceiling or mask
    membership cannot be reconstructed, fail closed.  Keep the free-running
    per-key refill exact >= control exact - 1 and pooled refill fraction >=
    pooled control - 0.05 with matched denominators and a real control
    counterpart, and add a prospective 3/8 exact-prompt floor for BOTH engines
    per eight-prompt key (a worse control is "test insufficient/ineligible",
    not permission to accept zero exact refill outputs).  Pool only matched
    rows; long/round-1024 rows need matching controls or explicit standalone
    bounded rules and are excluded from both pooled denominators.  Require at
    least 32 shared generated steps per request, including post-re-prefill
    positions, plus reconstructed decisions immediately after a boundary (an
    earlier divergence leaves that key ineligible).  Retain the registered
    coverage, drift relative bounds over an explicitly recorded minimum shared
    prefix exposure, and Part B >= 1.3x.  Missing records, broken controls,
    NaN/non-finite statistics and insufficient exposure FAIL CLOSED.
  calibration_partition: >-
    Padded-only calibration, frozen now and distinct from the padded-only
    validation control: sampled calibration chunks [0,2,4,6] / [1,3,5,7];
    validation retains [0,4,1,5] / [2,6,3,7].  Calibration never calls refill,
    and no refill observation may change its envelope.  Keep arm/N/sampling
    strata separate; a noisy deep-N group must not make an unlooped group
