        Record trusted lifecycle evidence sufficient to distinguish startup
        failure, candidate execution at the outer deadline and failure after
        candidate completion; candidate-produced stdout or stderr alone is
        insufficient.
      attribution_classes:
        startup_or_daemon_failure: "infrastructure/unknown"
        candidate_running_at_outer_deadline: "registered outer-deadline failure"
        failure_after_candidate_completion: "infrastructure/unknown"
        unresolved_attribution: "infrastructure/unknown"
      retry_count: 1
      retry_precommit: >-
        Before v3, precommit one identical-configuration retry for each
        infrastructure-affected test after documented infrastructure recovery.
      retry_configuration: >-
        The retry uses identical candidate, test, execution and verifier bytes
        and identical frozen configuration; preserve both attempts and use the
        first conclusive result.
      first_conclusive: >-
        The first conclusive result controls.  Conclusive candidate failures
        and passes receive no retry.
      blocked_rule: >-
        SUPERSEDED HISTORY, not operative: the earlier rule that a retry which
        remains infrastructure/unknown leaves the count blocked is replaced by
        the round-8g terminal infrastructure-unverified disposition.  The old
        text "A retry that remains infrastructure/unknown leaves the count
        blocked; unknown is not permission to repeat until a pass" is retained
        only as history.
      cleanup_rule: >-
        Verify termination and cleanup; accept no result obtained after the
        deadline, and cleanup time does not extend the acceptance budget.
      v2_timeout_fact: >-
        V2 contains one timed-out request,
        taco:e25eee8cc5e8629bbbeb6875:0, comprising 40 timed-out tests, with
        insufficient lifecycle evidence to substantiate a categorical
        not-infrastructure attribution.
      outer_deadline_liveness: >-
        An outer-deadline failure requires established execution entry before
        the deadline and positive liveness evidence that the identified child
        had not exited at the deadline.  Absence of an exit record, a delayed waitpid
        observation or a finish-record timestamp alone is insufficient; clock
        and observation uncertainty spanning the deadline produces
        infrastructure/unknown.
    lifecycle_evidence:
      threat_model: >-
        The lifecycle design is approved only for the frozen original-model
        completions to the pilot problems.  It does not claim isolation from
        arbitrary verifier-aware malicious code; user 65534:65534 and the
        other registered sandbox restrictions remain unchanged.
      original_model_completions: >-
        The threat-model assumption is original-model provenance: the frozen
        completions were produced by the registered original model.  This is
        an assumption, not proof that the programs are harmless.
      residual_same_uid_risk: >-
        Same-UID interference remains a disclosed residual risk.  A candidate
        that obtains the authentication key or alters the wrapper state may
        produce apparently valid evidence; validation cannot exclude every
        possible same-UID compromise.
      fail_closed_rule: >-
        Detected evidence corruption, loss or inconsistency fails closed:
        missing, malformed, unauthenticated, duplicated, inconsistent or
        improperly ordered evidence yields infrastructure/unknown even when
        stdout is correct and Docker returns zero.
      not_candidate_proof_isolation: >-
        This approval is not candidate-proof isolation and must not be
        represented as such; correct output remains an independent pass
        requirement.
      bootstrap: >-
        A frozen bootstrap performs verifier setup before the execution-entry
        record, closes the evidence descriptor before candidate-controlled
        execution and leaves no key in candidate-accessible arguments,
        environment, files, globals or live runner frames.
      private_pipe: >-
        The bootstrap reports execution entry through a private
        child-to-wrapper pipe before candidate-controlled execution.
      execution_entry_boundary: >-
        Freeze the precise execution-entry boundary.  Candidate
        parsing/compilation may belong to the candidate invocation;
        subsequent process creation or verifier setup cannot silently remain
        between the marker and that boundary.
      handoff: >-
        A successful handoff must be distinguished from a failed or incomplete
        one; a marker immediately before an attempted exec does not prove
        successful execution.  Failed or uncertain handoff is
        infrastructure/unknown.
      key_isolation: >-
        The candidate receives neither the authentication key nor the evidence
        descriptor; no key appears in candidate-accessible arguments,
        environment, files, globals or live runner frames.
      hmac_sha256: >-
        Keyed authentication uses actual HMAC-SHA-256, not SHA256(nonce +
        payload) called HMAC.
      per_attempt_key: >-
        A fresh per-attempt key authenticates each attempt and is not reused
        across attempts.
      authenticated_framing: >-
        Authenticated framing and identities are unambiguous and bind the
        records to the particular attempt and tracked child.
      identity_binding: >-
        The wrapper binds child identity, execution entry, child-status
        observations and exit status to the attempt, and forwards lifecycle
        evidence separately from candidate stdout/stderr.
      stdout_stderr_separation: >-
        Candidate stdout/stderr are kept separate from lifecycle authority; a
        shared writable mount may transport authenticated bytes but supplies
        no independent authenticity or liveness guarantee.
      state_specific_validation: >-
        Every conclusive Docker outcome - pass, wrong answer, candidate error
        or outer-deadline failure - requires a complete, valid record
        appropriate to that outcome.  Validation precedes acceptance at the
        grader, counting classifier and count-loading boundary.
      pass_outcome: >-
        A pass requires the unchanged output comparison, genuine successful
        child exit, timely successful completion, a complete valid lifecycle
        and verified termination/cleanup.
      wrong_answer_outcome: >-
        A wrong answer requires the genuine child exit status, completed
        lifecycle and valid attempt-bound evidence appropriate to a normal
        result before it is accepted as conclusive.
      candidate_error_outcome: >-
        A candidate error requires the genuine child exit status, completed
        lifecycle and valid attempt-bound evidence; an ordinary timely
        candidate nonzero exit with otherwise valid execution evidence remains
        a candidate error.
      outer_deadline_outcome: >-
        An outer-deadline failure requires established execution entry before
        the deadline, positive evidence supporting liveness at the deadline,
        and verified eventual termination/cleanup; it does not require a
        fictitious pre-deadline exit record.
      invalid_evidence_rule: >-
        Missing, malformed, unauthenticated, duplicated, inconsistent or
        improperly ordered evidence produces infrastructure/unknown even when
        stdout is correct and Docker returns zero.
      post_deadline_rule: >-
        Post-deadline evidence may establish attribution and cleanup but
        cannot make a candidate answer acceptable.
    terminal_infrastructure:
      disposition: "terminal infrastructure-unverified"
      completion_status: "not verified"
      replace_rule: >-
        After the single identical retry also remains infrastructure/unknown,
        the test is marked terminal infrastructure-unverified and the affected
        completion not verified, retaining its infrastructure reason.  This
        replaces the previous blocked-count rule prospectively.
      not_relabelled: >-
        Do not relabel a terminal infrastructure-unverified result as wrong
        answer, candidate error or timeout.
      other_completion_rule: >-
        Another completion for the same problem may still qualify through its
        own complete passing test set.
      extension_rule: >-
        Compute the existing extension rule from the resulting verified counts.
        No additional retry, replacement problem or special rescue follows
        from terminal infrastructure exclusion.
      count_status: "complete_with_terminal_infrastructure"
      count_rule: >-
        A count with complete coverage and valid attempt accounting may finish
        as complete_with_terminal_infrastructure when its remaining
        infrastructure cases have received the terminal disposition.  Report
        their test/request identities, reasons and split/domain counts, and
        compute verified problem counts and the unchanged extension decision
        from the resulting verified completions.
      remaining_blockers:
        - "incomplete request/test inventories"
        - "invalid attempt history"
        - "freeze or configuration mismatches"
        - "unverified termination/cleanup"
      pending_retry: >-
        A retry awaiting documented recovery remains pending; pending retries
        remain blockers.
      missing_accounting: >-
        Missing infrastructure accounting is never zero.
      superseded_blocked_rule: >-
        SUPERSEDED HISTORY, not operative: the earlier rule that a retry which
        remains infrastructure/unknown leaves the count blocked is replaced by
        the terminal infrastructure-unverified disposition above.
    attempt_ledger:
      ledger: >-
        The single official v3 run may resume under its existing run identity
        and immutable freeze using a durable append-only attempt ledger.
      durable_append_only: >-
        The ledger is durable and append-only; appends are serialized, framed,
        integrity-checked and durably flushed, and torn tails are recovered
        without discarding valid committed results or concealing partial
        records.
      commit_start_before_dispatch: >-
        Record and durably commit attempt-start before dispatch.
      commit_result_after_completion: >-
        Commit the attempt evidence/result immediately after completion.
      interrupted_attempt: >-
        An interrupted attempt lacking a valid durable completion is
        infrastructure/unknown and consumes that attempt.
      interrupted_retry: >-
        A retry interrupted in this way exhausts the retry allowance and does
        not create a third attempt.
      never_regrade: >-
        Never regrade a durably recorded conclusive result.
      resume_rule: >-
        Resume corpus/index construction from validated completed artifacts
        without repeating grading; missing or inconsistent evidence about the
        freeze or attempt history cannot be repaired by starting a new output
        directory.
      not_second_freeze: >-
        Resume is continuation of the same freeze and run identity, not
        authorization for another freeze or a favorable recount.
      validation_before_resume: >-
        Resume only after validating frozen inputs, executing implementation,
        dependencies, image digest and configuration.
      artifact_stages: >-
        Resume later artifact stages from validated completed artifacts
        without repeating grading.
      freeze_identity: >-
        Resume must retain the same run identity and immutable freeze.
    acceptance:
      count_acceptance: >-
        Count acceptance requires explicit complete status in the manifest and
        summary, exact expected-request coverage and explicit applicable
        per-test execution/infrastructure accounting; absent status or absent
        infrastructure accounting is never upgraded to zero.
      freeze_acceptance: >-
        The freeze and count receipt bind the actual resolved executing modules
        and entry points, including shortfall.py and decoding/classification
        code, with actual paths, hashes and full source commit provenance;
        interpreter and dependency mismatches are rejected before grading.
      corpus_index_acceptance: >-
        Corpus/index acceptance verifies the manifest self-hash and every
        declared file hash, derives identities, counts, domains and token
        denominators from actual corpus bytes, and establishes exact
        correspondence among official verified requests, original completion
        contents, raw rows and rendered row/mask identities.
      legacy_refusal: >-
        Reject legacy counts rather than silently upgrading their meaning; a
        legacy count that lacks explicit complete status, coverage and
        accounting is not acceptable.
      executing_module_binding: >-
        Bind resolved executing module files and entry points, including
        counting, decoding, extraction, grading, classification and relevant
        loading/filtering code.
      actual_bytes_derivation: >-
        Derive identities, counts, domains and token denominators from actual
        corpus bytes, and verify fixed ordering, split membership and rendered
        row/mask identities.
