  exactness_rule: >-
    Keep the existing per-key refill exact >= control exact - 1 and pooled
    refill fraction >= pooled control - 0.05 with matched denominators, plus
    the 3/8 exact-prompt floor for both engines per eight-prompt key.  Do not
