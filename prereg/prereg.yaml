      problem (50 x 4 = 200 attempts).  The selected set is 23 math, 19 code and
      8 chat before verification.
    truncation_rule: >-
      Scan the realized bucket-59 problems in ascending
      sha256(0:stage0_request_id(problem_id, sample_index)) order, ties by
      request_id; a problem enters when its earliest request appears; stop at
      50 distinct problems; keep all four samples of every selected problem.
      This is deterministic and is not re-drawn after seeing any result.
    retained_row_rule: >-
      An attempt is retained only if its completion passes the Stage 0 sample
      filter (finish_reason=stop, closed thought channel, non-empty answer,
      rendered length <= 8192) and, for a verified target, its answer is
      verified (math by the registered math rule; code only by the frozen
      Docker verifier).  Chat is not a verified target and never counts toward
      a verified target count.  Rejected attempts are reported, never replaced.
    # Round 8e: P1 is descriptive for every count and never gates P2.
    role: "descriptive-only; never gates P2"
    gates_p2: false
    continuation_gate: >-
      None.  Removing P1's continuation gate is unconditional for this
      amendment; P2 eligibility is governed only by the frozen P2 domain and
      the final 20/30 distinct-problem check.
    small_sample_threshold: 20
    zero_count_rule: >-
      With zero verified P1 problems, P1 is labelled unevaluable and reported
      with its actual small sample size.  An empty or nonempty P1 never changes
      the extension branch, teacher choice, arm matrix, architecture selection,
      stopping or any confirmatory claim.
    domain_rule: >-
      P1's verified domain is math plus code passing the frozen Docker
      verifier; chat never counts as a verified target.  The 19 selected code
      problems are eligible only through the frozen verifier.  Use only the
      original selected 50 P1 problems with their original split membership;
      do not expand to unused bucket members, replacement problems or nominal
      target sizes.  Freeze the complete problem/request ID list before
      applying this amendment.
    min_verified_problems: 20
    shortfall_rule: >-
      P1 is descriptive for every count and does not gate P2.  With fewer than
      20 verified P1 problems its estimates are labelled small-sample
      descriptive; with zero, P1 is unevaluable.  No P1 metric or diagnostic
      acquires an informal veto, influences the arm matrix, or triggers a
      different sampling plan.  The pilot's P2 continuation is governed only
      by the final T-fit/selection 20/30 check in pilot.shortfall.
    blocks: ["15-29", "15-19", "16-18", "25-29"]
    metrics:
      - per-layer cosine and RMS
      - untrained KL
      - temperature-calibrated delta NLL
    gpu_hours: 0.3
    r_rdamped_n_range: "1..8 (descriptive, about +0.2 h)"
    description: >-
      Forward-only sweep on 50 bucket-59 held-out verified-correct problems
      x 4 samples = 200 rows; purely descriptive and never a selection rule or
      a P2 gate.  R/R-damped are extended to N = 1..8 descriptively for the
      dial.
  p2:
    heal_tokens: 3000000
    candidates: >-
      A pre-listed 11-arm matrix of short 3M-token heals: nine
      selection/control arms plus two descriptive single-exit legacy arms
      (anytime-tax references, never eligible).  The five L selection arms are
      the three loop blocks with the zero-init per-channel bridge and E4B;
      15-29 with the legacy scalar and E4B; and 25-29 with the zero-init bridge
      and 12B QAT q4_0.  Each is paired with an O-H control whose rank-16 LoRA
      targets the same block layers on its single pass: O-H[25-29] with E4B and
      with 12B QAT q4_0, plus O-H[16-18] and O-H[15-29] with E4B (two added
      short heals in round 7).  L arms are trained with the dial objective;
      each L arm and its matching O-H control use the same rank-16 LoRA on the
      same block layers, which gives matched LoRA capacity, not exact total
      parameter equality.  L additionally carries the 1,536-parameter recurrent
      bridge and the multi-exit/loop package, itemized separately.
      Every pilot quantity is a selection input only; the confirmatory claims
      are E2-E4 and D1.
    domain_and_freeze: >-
      P2's verified domain is math plus code passing the frozen Docker verifier;
      chat never counts as a verified target (pilot.shortfall).  The realized
      T-fit split (57-58) has 86 problems (29 math, 38 code, 19 chat) and the
      realized selection split (54-56) has 152 problems (62 math, 60 code, 30
      chat); these are input counts, not retained verified traces.  Use only
      the original selected input sets: the 86 originally sampled T-fit
      problems and the 150 originally sampled selection problems, with their
      original split membership.  Their complete problem/request ID lists are
      frozen before this amendment; do not expand to unused bucket members or
      nominal target sizes.  The final P2 corpora are the distinct verified
      math-plus-code problems from these sets, in ascending
      sha256(0:request_id) order within each split, frozen with the staged
      freeze and the prereg-v1-data addendum before any pilot scoring.  If the
      count trigger fires, the union of eligible original and additional traces
      is used; traces are never chosen by teacher/student loss or replaced by a
      preferred new one.
    shortfall_rule: >-
      Complete the original per-request accounting first.  If nT0>=20 AND
      nS0>=30 distinct verified math-plus-code problems, use only the original
      attempts and make no extension.  Otherwise generate exactly four
      additional attempts, indices 4,5,6,7, for every math/code problem in both
      original P2 input sets (one bounded extension, never a top-up of only the
      deficient split or only near-passing problems).  P2 runs only if final
      T-fit>=20 AND final selection>=30 distinct verified problems and all
      other registered prerequisites hold; otherwise the pilot is unevaluable
      and P2 does not run.  There is no second batch, lower minimum, relaxed
      filter, borrowed bucket, domain substitution or default
      teacher/architecture.  D and E are rejected by pilot.shortfall.
      Confirmatory D1 remains math-only under its separate contract.
    teacher_stage: >-
      Teacher stage: for each teacher in {E4B, 12B QAT q4_0}, run
      25-29 + zero-init per-channel g at L's primary N=4 and O-H[25-29] at
      N=1.  The teacher with the larger mean calibrated-NLL gain over O across
      those two measurements wins; E4B wins ties within 0.003 nats.
    block_bridge_stage: >-
      Block/bridge stage, after the teacher is fixed: compare the E4B L arms
      (25-29 + gch, 16-18 + gch, 15-29 + gch, 15-29 + legacy scalar) with rule
      B, each against the E4B O-H whose LoRA targets the same block layers.  The
      12B L arm is the teacher stage only and is not a block/bridge candidate;
      the two anytime-tax arms are descriptive and never eligible.
    final_recipe_teacher_rule: >-
      The chosen recipe (block and bridge from the block/bridge stage) is then
      trained with the teacher selected in the teacher stage, so a 12B win
      carries through to Stage 1/2 and to the final O-H.  This is the
      round-8 text's "chosen recipe trained with the selected teacher"; it does
      not make 12B a block/bridge candidate.
    selection_only: true
    arms:
      - "25-29 + zero_init_per_channel_g + E4B"
      - "16-18 + zero_init_per_channel_g + E4B"
      - "15-29 + zero_init_per_channel_g + E4B"
      - "15-29 + legacy_scalar + E4B"
      - "25-29 + zero_init_per_channel_g + 12B_qat_q4_0"
      - "O-H[25-29] + E4B"
      - "O-H[25-29] + 12B_qat_q4_0"
      - "O-H[16-18] + E4B"
      - "O-H[15-29] + E4B"
      - "25-29 + zero_init_per_channel_g + E4B + single_exit_legacy (N 2/3 at 0.9/0.1)"
      - "25-29 + zero_init_per_channel_g + E4B + single_exit_legacy (N=4 fixed)"
    verified_corpus: >-
      O's verified-correct traces on held-out problems (teacher-neutral), not
      O's raw samples.
    endpoints:
      - "delta_loop = calibrated NLL(L,N=1) - calibrated NLL(L,N=2)"
      - "delta_arm = calibrated NLL(O-H[block]) - calibrated NLL(L,N=2) using the O-H with the same block layers; matched rank-16 LoRA capacity per block, with L's 1,536-parameter bridge and multi-exit package itemized separately"
      - "KL(O || L N=1) = 0 by construction"
      - "Delta_bar_arm = mean over N=2..4 of [cNLL(O-H[block]) - cNLL(L,N)], same teacher and data; the rule-B ranking statistic"
      - "reported for every arm: cNLL at N=1..4, 6, 8, monotonicity, delta_loop, delta_arm, FLOPs and bytes read per token at N=4"
    temperature_fit: "per (arm, checkpoint, N) on a separate fit split"
    bootstrap: "paired problem-cluster bootstrap"
    teacher_selection_rule: >-
      Teacher first: choose the teacher with the larger mean calibrated-NLL gain
      over O of (25-29+gch+T) at L's primary N=4 and (O-H[25-29]+T) at N=1;
      E4B wins ties within 0.003 nats.
    teacher_gain_basis: "mean calibrated-NLL gain over O of (25-29+gch+T) at L N=4 and (O-H[25-29]+T) at N=1"
    block_bridge_rule: >-
      Rule B (dial-aware, adopted by the panel; corrected in round 6).  Step 1:
      eligible set E = the frozen 84c5da0 eligibility criteria, except that
      delta_arm uses the block-matched O-H (round 7, disclosed): the E4B L arms
      with a delta_loop 95% problem-cluster lower bound > 0 and a delta_arm
      point estimate >= -0.02, where delta_arm = cNLL(O-H[block]) -
      cNLL(L,N=2) using the O-H with the same block layers (matched rank-16
      LoRA capacity per block; L's bridge and multi-exit package are itemized
      separately).  STOP iff E is empty.  Step 2: rank the arms
      in E by Delta_bar_arm = mean over N=2..4 of [cNLL(O-H[block]) - cNLL(L,N)], same
      teacher and data.  Step 3: the monotonicity filter is a FILTER on point
      estimates, not a preference: cNLL(N+1) - cNLL(N) <= 0.005 nats/token for
      N=1,2,3 and cNLL(8) <= cNLL(1).  If at least one arm in E passes the
      filter, select the argmax of Delta_bar_arm among the passing arms;
      otherwise select the argmax of Delta_bar_arm over all of E (unfiltered).
      Ties within 0.003 nats of the maximum go to the lower FLOPs ratio, then
      to the zero-init bridge, then to the smaller block.  Report Delta_bar_arm,
      delta_loop, delta_arm, cNLL at N=1..4,6,8, monotonicity, FLOPs per token
      and bytes read per token at N=4 for every arm.
    block_bridge_teacher: >-
      The block/bridge comparison uses the E4B arms and, for each L arm, the
      O-H control with the same block layers.  The chosen recipe is then
      trained with the selected teacher, and the final O-H uses that same
      teacher and the chosen block's layers.
    selection_rule: >-
      One deterministic two-step rule: teacher first (mean gain over O of
      (25-29+gch+T) at L N=4 and (O-H[25-29]+T) at N=1, E4B tie-break within
      0.003 nats), then block and bridge among the E4B arms by rule B above.
      Rule B ranks only within the frozen 84c5da0 eligibility; its monotonicity
      filter can only narrow that set, never replace it.  Every pilot quantity
      is selection-only; H1/H0 are not confirmatory claims.  The confirmatory
      claims are E2-E4 and D1.
    stop_rule: >-
      STOP iff the frozen 84c5da0 eligible set E is empty; then publish the
      mechanism null and stop Part 1 training.  The monotonicity filter cannot
      make STOP fire.
    eligible_set: >-
      E = {E4B L arms : delta_loop 95% problem-cluster lower bound > 0 AND
      delta_arm point estimate >= -0.02}, the frozen 84c5da0 eligibility;
      delta_arm uses the matching O-H (same block layers) and L(N=2) with
      matched rank-16 LoRA capacity per block; the recurrent bridge and
      multi-exit package are not capacity-matched and are itemized separately.
    ranking_statistic: >-
      Delta_bar_arm = mean over N=2..4 of [cNLL(O-H[block]) - cNLL(L,N)]
      using the matching O-H at the same teacher and data; this replaces the
      heal-confounded cNLL(1) - cNLL(N).
    monotonicity_filter: >-
      Point estimates: cNLL(N+1) - cNLL(N) <= 0.005 nats/token for N=1,2,3 and
      cNLL(8) <= cNLL(1).  A filter on E, not a ranking preference.
    fallback_rule: >-
      If no arm in E passes the monotonicity filter, rank all of E by
      Delta_bar_arm without the filter.  STOP is unchanged and depends only on
      E being empty.
    oh_lora_target: >-
      Each pilot L arm has a matching O-H control that applies the same rank-16
      LoRA to the same block layers on its single pass: O-H[25-29], O-H[16-18]
      and O-H[15-29].  LoRA capacity is matched per block, so delta_arm and
      Delta_bar_arm are not LoRA-capacity contrasts; L's 1,536-parameter bridge
      and multi-exit/loop package are itemized separately and are not claimed
      to be matched.  The final O-H uses the chosen block's layers.
    min_arm_vs_oh_nats: -0.02
    tie_nats: 0.003
    tie_break:
      - lower FLOPs ratio at N=4
      - zero-init per-channel bridge over legacy scalar
      - smaller loop block
    teacher_choice: "mean gain over O of (25-29+gch+T) and (O-H+T); E4B tie-break within 0.003 nats"
    kl_gap_secondary: "fraction of the teacher KL gap closed at N=2"
    dial_rule: >-
      Rule B: E = the frozen 84c5da0 eligibility; STOP iff E is empty.  Rank E
      by Delta_bar_arm = mean_{N=2..4}[cNLL(O-H[block]) - cNLL(L,N)] using the
      matching O-H; the adjacent regression filter (<= 0.005 for N=1,2,3 and
      cNLL(8) <= cNLL(1)) narrows E only if at least one arm passes, otherwise
      rank unfiltered E.
    dial_metrics_reported: >-
      cNLL at N = 1..4, 6, 8 per arm; monotonicity; Delta_bar_arm; delta_loop;
      delta_arm; FLOPs and bytes read per token at N=4.
    frozen_rule_deviation: >-
      Disclosed deviation from the selection/STOP rule frozen at 84c5da0:
      round 5 adopted the dial-aware rule B and round 6 corrected its mechanics.
      E (the frozen eligibility) is the STOP set; the monotonicity filter only
      narrows the ranking.  At the decision time the controller had seen only
      the 4-row GPU smoke of campaign stage A (25-29, N=2: delta NLL R +0.133,
      R-damped +0.022) and the N=1 child (cNLL 0.1774, T 0.887, top-1 0.935,
      loop-free by construction); the native evaluator read n1.json; the
      round-5 drafter saw that note in dial-panel-native.md; the t5c fix-round-4
      implementer listed runs/trainfree without reading files; no other agent
      touched Stage A outputs.  No N >= 2 Stage A output was read before these
      rules.  Stage A remains exploratory and is never an input to selection.
      The candidate set {25-29, 16-18, 15-29} x bridges remains frozen.  The
      pilot is a selection gate only; the confirmatory claims are E2-E4 and D1,
      and H1/H0 do not gate any confirmatory endpoint.
    anytime_tax_arm: >-
      Two descriptive single-exit legacy arms (N 2/3 at 0.9/0.1, and N=4 fixed)
      on 25-29 + zero_init_per_channel_g + E4B; they measure the anytime tax at
      N=2 and at the primary N=4 and are never eligible for selection.
  p3:
    model: O only
    steps: 30
    dev: "200 held-out math problems x 4 samples"
    prompt_bucket: "Stage 0 train bucket 0-49"
    completion_cap: 4096
    prompt_median_max: 2500
    keep_rule: >-
      Keep Stage 2 if the 30-step RL run on O gains at least 2 paired standard
      errors of dev pass@1 and keeps truncation below 10 %; exact-answer math
      has no meaningful hacking flags.  Otherwise use the registered fallback.
    paired_se: 2.0
    max_truncation: 0.10
    fallback: RFT on verified self-traces
    hacking_flags: not applicable to exact-answer math; code audit only
    description: >-
      Short RL on O only, at a 4k cap on prompts whose O median is <= 2.5k, to
      decide Stage 2 versus the registered RFT fallback.  Never scored on
      benchmarks.
  data:
    pilot_train_tokens: 3000000
    pilot_dev_problems: 500
    pilot_dev_samples: 4
    temperature_fit_problems: 100
    long_traces: 500

# ---------------------------------------------------------------------------
# Loop ladder (descriptive/estimation only, after the tag)
# ---------------------------------------------------------------------------

loop_ladder:
  role: descriptive/estimation only
  runs_after_tag: true
  selection_use: never used for pilot or selection
  chosen_block: pilot-chosen block
  r_rule: "pure repeat: h_prev"
  r_damped_rule: "x <- (1 - 1/N) * x + (1/N) * block_out (damped Euler step)"
  r_damped_weight: >-
    1/N: 0.5 at N=2, 0.333 at N=3 and 0.25 at N=4.
  points:
    - id: O
      arm: O
      n: 1
      stage: reference
      description: original model, N=1
    - id: R-N2
      arm: R
      n: 2
      stage: untrained
      description: pure repeat on the chosen block
    - id: R-N3
      arm: R
      n: 3
      stage: untrained
      description: pure repeat on the chosen block
    - id: R-N4
      arm: R
      n: 4
      stage: untrained
      description: pure repeat on the chosen block
    - id: R-damped-N2
      arm: R-damped
      n: 2
      stage: untrained
      description: damped Euler update on the chosen block
    - id: R-damped-N3
      arm: R-damped
      n: 3
      stage: untrained
      description: damped Euler update on the chosen block
    - id: R-damped-N4
      arm: R-damped
      n: 4
      stage: untrained
      description: damped Euler update on the chosen block
    - id: L-heal-N2
      arm: L
      n: 2
      stage: after-stage-1
      description: L after Stage 1 (healed) at N=2
    - id: L-heal-N3
      arm: L
      n: 3
      stage: after-stage-1
      description: L after Stage 1 (healed) at N=3; DiD at a second primary-adjacent depth
    - id: L-heal-N4
      arm: L
      n: 4
      stage: after-stage-1
      description: L after Stage 1 (healed) at N=4; the DiD point at the primary N
    - id: L-final-N2
      arm: L
      n: 2
      stage: after-stage-2
      description: L final at N=2; the paired D2 baseline on the full LCB
    - id: L-final-N3
      arm: L
      n: 3
      stage: after-stage-2
      description: L final at N=3 (ladder items; Holm)
    - id: L-final-N4
      arm: L
      n: 4
      stage: after-stage-2
      description: L final at N=4; the primary confirmatory run (full LCB); the ladder LCB part is reused from the D2 run
    - id: O-H-heal-N1
      arm: O-H
      n: 1
      stage: after-stage-1
      description: O-H control after Stage 1
    - id: O-H-final-N1
      arm: O-H
      n: 1
      stage: after-stage-2
      description: O-H control after Stage 2
  items: "LCB post-cut 182 x 1 + GPQA 198 x 1 per ladder point"
  full_suite_at: L final N=4
  oh_control: "O-H after Stage 1 (N=1) and after Stage 2 (N=1)"
  untrained_bridge_note: >-
    gch at init with loop_only is O exactly, so the untrained looped measurement
    uses the R and R-damped bridges, not gch.
  dial_nll_at_heal: >-
    D1/D5 metrics at L-heal are descriptive: cNLL at N = 1..4, 6, 8,
    monotonicity, ||delta h_t|| curves and the period-2 ratio.  L-heal runs at
    N=2, N=3 and N=4 on the ladder items, so the difference-in-differences is
    measured at the primary N=4.
  reused_from_d2: >-
    L-final-N4's LCB part is the E2/D2 primary run; L-final-N2's 182-item LCB
    part is a view of the full N=2 LCB baseline run (identical engine and
    harness), not a new generation.  The N=2 full-LCB run remains the paired D2
    baseline.
  gpu_hours: "≈37 local GPU-hours without reuse (the N=4 LCB part is reused from D2); the L-heal N=3/N=4 points are charged in the evaluation row (+8-11 padded / +1.5-2 refill for 25-29)"
  gpu_hours_with_reuse: "less than 37 if campaign stage B is reused; recorded after the campaign"
  reuse_rule: >-
    Campaign results are reused for the ladder only with identical
    engine/harness, never for E3 or the difference-in-differences.
  chart: >-
    Accuracy vs N with O, R, R-damped, L-heal and L-final lines plus O-H
    references; progress_charts acc_vs_n extended with stage labels.
  did_note: >-
    Provides the post-Stage-1 measurements needed by the difference-in-
    differences.  The primary DiD is at N=4; N=2 is descriptive.  The N=3/N=4
    L-heal runs are charged in the evaluation row, not twice here.

