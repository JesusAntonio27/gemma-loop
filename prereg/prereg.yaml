revision_round8c:
  title: "Revision round 8c (pre-tag technical reconciliation and seal-readiness amendment)"
  date: "2026-11-05"
  stage_a_exposure: >-
    Stage A was exposed before this round (section 0.1 and the round-8b
    record).  Every round-8c change is therefore a pre-tag technical amendment
