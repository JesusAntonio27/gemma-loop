# MDE table (computed with gemmaloop.eval.stats.mde, alpha=0.05, power=0.80,
# omega2=1/12, sigma2=1/6; k = samples per item)
# ---------------------------------------------------------------------------

mde_table:
  - bench: lcb_v6_full
    n: 1055
    k: 1
    mde_pts: 5.57
  - bench: lcb_v6_full_e2_alpha_0.02_one_sided
    n: 1055
    k: 1
    mde_pts: 5.75
    alpha: 0.04
    note: "E2 if D1 fails: one-sided 0.02 == two-sided 0.04; 5.75 pp at 1,055 (the design rounded it to 5.76)."
  - bench: lcb_v6_minimum_728
    n: 728
    k: 1
    mde_pts: 6.70
  - bench: lcb_postcut_subgroup
    n: 182
    k: 1
    mde_pts: 13.40
  - bench: lcb_google
    n: 1055
    k: 1
    mde_pts: 5.57
  - bench: gpqa
    n: 198
    k: 4
    mde_pts: 8.13
  - bench: mmlupro
    n: 2000
    k: 1
    mde_pts: 4.04
  - bench: mmmu_pro_standard
    n: 300
    k: 1
    mde_pts: 10.44
  - bench: mmmu_pro_vision
    n: 300
    k: 1
    mde_pts: 10.44
  - bench: mathvision
    n: 300
