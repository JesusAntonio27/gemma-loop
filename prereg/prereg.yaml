# Registered engine gate (Task 5d; rebuilt from feat a7c0633 in round 7).
# The gate and Part B run AFTER the prereg-v1 tag and BEFORE any trained-arm
# evaluation.  Refill is the evaluation engine only if both pass; otherwise the
# padded adaptive-batch engine is used.  O and O-H are unlooped arms;
# L covers every candidate block x bridge that will be generated: gch/scalar
# for the pilot/confirmatory arm and none/damped for the ladder.
engine_gate:
  status: >-
    INACTIVE (historical record only; no execution authority for prereg-v1).
    The padded adaptive-batch HF engine is the sole operative engine; the gate,
    re-prefill smoke and Part B are not run.
  prompts: tests/fixtures/engine_gate_prompts.json
  size: e2b
  quant: bf16
  runs_after_tag: false
  logprob_mean_limit: 0.01
  logprob_max_limit: 0.1
  max_new_tokens: 256
  round_size: 64
  max_batch: 4
  seed: 0
  token_limit: 256
  near_tie_logit_gap: 0.25
  # Legacy absolute floor.  The registered v4 rule is in noise_floor_control
  # (per-key refill exact >= control exact - 1 and pooled >= control - 0.05);
  # the registered run passes 0.0 for this legacy field.
  min_exact_fraction: 0.0
  sampling_n: [2, 3, 4, 6, 8]
  throughput_n: [1, 4]
  comparison_prompts: 8
  refill_budgets: [128, 128, 192, 192, 256, 256, 256, 256]
  long_prompts: 4
  long_max_new_tokens: 64
  long_round_size: 64
  long_round_1024_tokens: 1200
  control_batch: 4
  one_n1_key_per_block: true
  noise_floor_control: >-
    Padded engine at batch 4 with a different batch composition/order vs the
    padded reference on the same prompts.  Refill passes a key iff
    refill_exact_prompts >= control_exact_prompts - 1, pooled exact fraction
    >= pooled control - 0.05, drift_mean <= 2 * control_mean + 0.005,
    drift_max <= 2 * control_max + 0.05, and every refill divergence is a
    near-tie within 0.25 logits (two bf16 steps).  The control's own statistics
    are recorded.  The control is never built on refill's own re-prefill code.
  re_prefill_smoke: >-
    Registered smoke, logged in the ledger and NEVER counted toward the gate:
    O N=1, L 15-29 gch N=2 greedy and sampled, and one round-1024 row.  The
    smoke report must compute and record amendment_permitted.  After the smoke
    only the exactness margins may be amended, and only if every refill
    divergence is a near-tie and logprob drift is within the registered
    bounds; near-tie threshold, drift bounds, coverage and prompts stay fixed.
    Any amendment is committed before the registered run.
  registered_reduction: >-
    Keep the gate ≤ 6 GPU-h: control at batch 4, one N=1 key per block
    (loop_only makes L N=1 equal to O), and never fewer than 8 prompts per key.
    Estimated 4.5-6.0 GPU-h INCLUDING model loads at 65-85 ms/step on the
    depth-weighted step count (the older 4.2-5.5 h excluded loads).
  gate_hours: "4.5-6.0 incl. model loads"
  smoke_hours: "10-20 min (logged, never counted toward the gate)"
  step_time_fallback: >-
    Pre-declared and fixed now: if the gate step-time smoke projects more than
    6 GPU-h, drop scalar sampled parity at N=6 and N=8 (the registered
    fallback) and commit the projection before the registered run.  No other
    coverage, prompt or exactness-margin change is permitted by this
    fallback.
  coverage_note: >-
    Greedy token-exact vs padded per key at N in {1,2,3,4,6,8}; sampled parity
    at N=4 and every Stage 2 N ({2,3,4,6,8}); throughput at N=1 and N=4; long
    prompts > 4096, static cache > 4096, the registered round 1024 and real
    mixed-history waves (late admissions with different history lengths).
  # ------------------------------------------------------------------
  # Round 8 (X1 item 1, X2): the honest pre-tag smoke record and the frozen
  # replacement eligibility rule (engine gate v6).  The current refill
  # candidate is NOT eligible; failure or inconclusive selects padded.
  # ------------------------------------------------------------------
  pre_tag_smoke_attempts:
    - "Attempt 1 (10:16): failed at argparse because Git Bash converted the --out path; relaunched with MSYS_NO_PATHCONV=1.  Launcher/local-environment crash, no model evidence."
    - "Attempt 2 (10:17-10:25): GPU-only crash, NameError _model_device in run_group's sampled gap lambda (the helper was imported only inside recompute_engine_logits and the CPU tests never exercised it); controller fix bec4e54 (module-level import) merged into prereg/v1-draft at 3ea177e."
    - "Attempt 3 (10:26-about 10:36): OOM in recompute_engine_logits because the HF head materialised [T, vocab] logits (2.76 GiB); controller fix logits_to_keep=1 merged into prereg/v1-draft; attempt 4 launched at 10:39."
    - "Attempt 4 (10:39-10:50, logged, never counted): completed SMOKE-FAIL.  O N=1 greedy refill exact 5/8 vs control 4/8 (margin OK) but one canonical gap 0.317 > 0.25 (others 0.04/0.04); L 15-29 gch N=2 greedy refill 4/8 vs control 5/8 (margin OK) but one gap 0.270 > 0.25; L sampled refill exact 1/8 vs control 4/8 (fails the per-key margin, below the registered 3/8 floor) with two reported large sampled gaps 1.962 (lcb-04 pos 96) and 1.770 (lcb-08 pos 86); logprob drift within bounds; re-prefill counters OK (7 rounds, 18 re-prefills, 4 late admissions, mixed histories); round-1024 row 2 near-tie divergences.  The registered amendment rule forbids an exactness-margin amendment on this artifact."
  pre_tag_smoke_artifact: "engine_gate/re_prefill_smoke.json (generated 2026-11-05T17:50:46.854164+00:00)"
  pre_tag_smoke_artifact_sha256: "fa117eff3be7a7ed46a5574073e7b17effef60abe0915f067e2b647ccaca046c"
  pre_tag_smoke_outcome: >-
    SMOKE-FAIL (counted=false, registered_pass=false).  The four attempts are
