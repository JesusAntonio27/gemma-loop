    validation as the calibration partition.  The control is never built on
    refill's own re-prefill code; complete control divergence records and both
    chosen IDs are retained.
  chosen_token_regret: >-
    Greedy D = max(max(c) - c[a], max(c) - c[b]) with tau_g = max(0.25,
    maximum calibration-control D + 0.0625), cap 0.50, computed identically
    for calibration control, validation control and refill.  Store the
    original canonical top-two gap distribution, the D distribution, maxima
    and exceedance counts separately.
  sampled_decision_traces: >-
    The sampled audit requires exact noise identity and successful
    reconstruction of each engine's actual chosen token.  A distant wrong
    token cannot be excused because some other top-two pair happens to lie
    close; the actual chosen IDs are evaluated.
  boundary_certificate: >-
    For a changed support, certify the actual top-k/top-p boundary and the
    raw/TV envelope above.  A large filtered Gumbel gap alone is neither a pass
    nor a bug verdict; never exempt every case merely because some mask bit
