# Gemma-Loop pre-registration, draft prereg-v1 (revision round 8c).
#
# DRAFT: this file is written to be frozen by the git tag `prereg-v1` BEFORE the
# pilot and before any training or trained-arm evaluation.  It is not the tag.
#
# The confirmatory design is the two-stage hybrid (Stage 1 heal + Stage 2
# Dr. GRPO RLVR) on E2B.  Part 2 is exploratory and is described only by its
# rules.  Sources: prereg-v1-draft-review.md, the controller rulings of
# 2026-11-04 at the end of progress.md, methodology-review-A/B,
# twostage-vs-current-design, twostage-feasibility-pc, audit-redteam-design,
# audit-eval-stats, data-length-audit and training-perf-report.
#
# Any change after the tag is a new version (prereg-v1.x) with a written reason.
# The public decision log is exported to docs/prereg-v1-decision-log.md at the
# tag.

tag: prereg-v1
version: prereg-v1
status: draft

# Round 8 (X1 item 2): the explicit claims paragraph.  D1 is an average
# calibrated-likelihood result on O-verifiable math traces, not a general
# "usable reasoning dial"; E2 is the complete looped package against a
# matched-data, matched-layer adapter control; D2 is the extra-depth effect;
# D4 is teacher-forced likelihood evidence only.  A D1 pass alone never yields
# the headline "a usable reasoning dial" or "every extra loop helps".
claims: >-
  D1 establishes average calibrated-likelihood gain and non-inferiority on
  O-verifiable math traces only: it is a calibrated-likelihood consistency
  result, not a general "usable reasoning dial", not per-token monotonicity,
  and not a guarantee for hard problems O cannot solve, code, arbitrary N or
  generated continuations.  E2 compares the complete looped
  training/inference package (multi-exit supervision and hinge, extra bridge,
  different RL depth strata and additional inference computation) with a
  matched-data, matched-layer adapter control; it is not the pure causal
  effect of recurrence with every training and compute factor held fixed.
  D2 measures the extra-depth effect of N=4 over N=2 and is estimation only;
  a flat tail or a non-significant difference is reported as a plateau or an
  unresolved effect, never as proof that every extra loop helps.  D4 provides
  teacher-forced likelihood evidence only and cannot supply adaptive-decode
  accuracy; adaptive-decode accuracy remains a named Part 2 milestone.  D4's
  winning policy is chosen on the same scored data, so its selected delta cNLL
  and interval are exploratory, selected and optimistic, not an unbiased
  selected-policy interval; fresh-data validation is required before any Part 2
  serving claim and the Part 2 "auto" entry is provisional.  O-H is the
  matched-data, matched-runtime control: its rank-16 LoRA targets the same
  block layers, which establishes matched LoRA capacity, not exact total
  parameter or training-FLOP equality.  L additionally carries the recurrent
  bridge (1,536 parameters) and the multi-exit/loop package, and those effects
  are itemized separately rather than attributed to recurrence alone.  The
  teacher comparison compares deployable teacher representations (runtime,
  quantisation and fidelity under the registered qualification rule), not model
  size alone; each teacher's fidelity result is reported beside the student
  gains.  The pilot "why" material is a set of descriptive explanations to
  investigate, not a causal identification result.  The pilot evaluation domain
  is O-solvable verified math plus code passing the frozen Docker verifier;
  chat never counts, and this does not establish the best teacher for chat,
  hard unsolved math, arbitrary code or generated-answer accuracy.  Code
  verification establishes passing the frozen tests, not formal correctness.
  Confirmatory D1 remains math-only under its separate contract.  Main training
  lineage and dose are explicit: Stage 1 restarts from O for both L and O-H,
  the 3M pilot heals are selection-only, and rendered input tokens, scored
  assistant tokens and repeated multi-exit targets are separate denominators; a
  3M pilot plus a 12M main run is never described as 12M.  Shared seeds do not
  establish cross-backend identity: local HF and Modal/vLLM parity is supported
  only by the same frozen artifacts and a recorded backend provenance, not by
  an "identical accepted set" assertion.  A D1 pass alone must not produce the
  headline "a usable reasoning dial" or "every extra loop helps".  The
  registered numerical endpoints and alpha allocation are unchanged.

# Primary loop count for every confirmatory contrast (round 5: N=4).
# Registered r_4 = 1 + 3 x the code's one-extra-pass fraction with the LM head
# included, to four decimals: 2.2824 (15-29), 1.4275 (25-29), 1.2515 (16-18).
primary_n: 4

# Training horizon T = block passes per step, over N = 1..8.  LoRA and the
# bridge are active only for N >= 2, so N=1 batches carry no gradient for L and
# are not used.  Heavy-tailed horizon: T=4 at 0.70, T in {5,6,7,8} at 0.075
# each; supervised exits = the last k=3 trainable passes (the BPTT window).
# N = 2..8 are trained (dense on 2-4); effort levels 1-4; N = 12, 16 are
# extrapolation, NLL only.
loop_probs: [0.0, 0.0, 0.0, 0.70, 0.075, 0.075, 0.075, 0.075]

# Evaluation sampling (generation_config.json; thinking on for every row).
sampling:
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  max_new_tokens: 32768
  enable_thinking: true

# Evaluation sizes.  "samples" is the number of generations per item.  Every
# bench declares its role explicitly; there is no default to "confirmatory".
benches:
  lcb:
    # Confirmatory E2/E3 set: the full LiveCodeBench release_v6 (1,055 items),
    # one sample per item.  The 182 post-cutoff items (contest_date >=
    # 2025-01-01) are a pre-specified subgroup reported separately.  This bench
    # also carries the Google reproduction check; no separate 182-item run is
    # generated.
    limit: 1055
    samples: 1
    seed: 0
    role: confirmatory
  lcb_google:
    # Virtual harness view of the same O full-v6 run; no separate generation.
    limit: 1055
    samples: 1
    seed: 0
    role: harness
    generated: false
    source_bench: lcb
  gpqa:
    # Secondary / estimation only (never in the fixed-sequence family).
    limit: 198
    samples: 4
    seed: 0
    role: secondary
  aime:
    # Base model (O) only; the arm comparison has an MDE of 18-33 pp.
    limit: 30
    samples: 8
    seed: 0
    role: o_only
    exploratory: true
  mmlupro:
    # Secondary / estimation only; 2,000 items is the stated minimum.
    limit: 2000
    samples: 1
    seed: 0
    role: secondary
  mmmu_pro_standard:
    # Secondary / estimation only; 300 items at 1120 image soft tokens.
    limit: 300
    samples: 1
    seed: 0
    image_soft_tokens: 1120
    role: secondary
  mmmu_pro_vision:
    # Secondary / estimation only; 300 items at 1120 image soft tokens.
    limit: 300
    samples: 1
    seed: 0
    image_soft_tokens: 1120
    role: secondary
  mathvision:
    # Secondary / estimation only; 300 items at 1120 image soft tokens.
    limit: 300
    samples: 1
    seed: 0
    image_soft_tokens: 1120
    role: secondary
  spatialeval_vqa:
    # Base model (O) only, exploratory; full split at 280 visual tokens.
    limit: 4635
    samples: 1
    seed: 0
    image_soft_tokens: 280
    role: o_only
    exploratory: true
  spatialeval_tqa:
    # Base model (O) only, exploratory; full split at 280 visual tokens.
    limit: 4635
    samples: 1
    seed: 0
    image_soft_tokens: 280
    role: o_only
    exploratory: true
  cvbench_2d:
    # Base model (O) only, exploratory; full 2D split at 280 visual tokens.
    limit: 1438
    samples: 1
    seed: 0
    image_soft_tokens: 280
    role: o_only
    exploratory: true

# Google's official thinking-mode figures.  This block is the single source of
# truth for every report; code reads it through gemmaloop.prereg.load_prereg.
# Text: Global Constraints line 15, model card and arXiv 2607.02770 Table 5.
# Vision: references/08 lines 50-53, Table 6, thinking mode at 1120 tokens.
# MMMU-Pro: one ambiguous "MMMU Pro" figure; registered as mmmu_pro_overall only.
google:
  E2B:
    mmlupro: 60.0
    gpqa: 43.4
    lcb_google: 44.0
    aime: 37.5
    mmmu_pro_overall: 44.2
    mathvision: 52.4
  E4B:
    mmlupro: 69.4
    gpqa: 58.6
    lcb_google: 52.0
    aime: 42.5
    mmmu_pro_overall: 52.6
    mathvision: 59.5

harness_tolerance_pts: 3.0

# Training sequence length and data length handling.
# max_length applies to Stage 1, the pilot heals and RFT only.  Stage 2 rows
# are bounded by stage2.prompt_cap + stage2.completion_cap = 10,240 tokens and
# are not filtered by max_length.
training:
  max_length: 8192
  length_mode: filter

# Seeds.  Seed 0 is the only confirmatory seed; seeds 1 and 2 are registered
# now as robustness-only runs (same data order and recipe), never as a
# replacement for the seed-0 verdict.  E4B is deferred.
seeds:
  e2b_oh: [0, 1, 2]
  e2b_l: [0, 1, 2]
  e4b_oh: []
  e4b_l: []

# Creative evaluation is Part 2 / exploratory, never a Part 1 endpoint.
creative:
  n_briefs: 150
  briefs_sha256: null
  judge_model: deepseek-flash
  judge_version: DeepSeek-V4.1-Flash-1017
  second_judge_model: null
  second_judge_revision: null
  human_pilot: 40
  human_main: 120

phase2: null

# ---------------------------------------------------------------------------
# Part 1: confirmatory design
# ---------------------------------------------------------------------------

part1:
  size: E2B
  seeds: [0, 1, 2]
  confirmatory_seed: 0
  extra_seeds: [1, 2]
  extra_seeds_role: >-
    Robustness only; extra seeds never replace the seed-0 verdict.  The
    crossed bootstrap is reported as a robustness check, not as the primary.
  extra_seeds_policy: >-
    Seeds 1 and 2 are registered now and run only if compute arrives; they run
    regardless of the seed-0 result.  The confirmatory verdict is computed once,
    on seed 0.
  arms:
    O:
      role: baseline
      description: >-
        Original instruction-tuned Gemma 4 E2B (snapshot pinned below), no
        loops, no adapter.
    O-H:
      role: control
      description: >-
        Same two-stage recipe as L but with no loop block.  O-H runs a real
        Stage 1 heal with the same teacher, data and 12M budget; its rank-16
        LoRA targets the same block layers as the matching L arm, so LoRA
        capacity is matched.  It carries no recurrent bridge and no multi-exit
        loop package; L's bridge (1,536 parameters), multi-exit supervision and
        loop machinery are itemized separately.  Stage 2 RLVR uses the
        identical prompts, order, G, steps, cap, sampling, LR and seeds.  O-H is
        therefore the matched-data, matched-LoRA-capacity control, not a
        claim that the L - O-H contrast is the pure causal effect of
        recurrence.
    L:
      role: treatment
      description: >-
        Looped model: the pilot-chosen loop block and bridge, the same Stage 1
        heal and Stage 2 RLVR, trained with the dial objective so every N in
        2..8 is usable.  In Stage 2, N is stratified per prompt group (not fixed
        per arm).
  diagnostic_arms: [R, R-damped]
  removed_arms: [SFT-mix-arms, L-plevec, O-H-ext]
  optional_arm: O-H-RLext
  optional_arm_condition: >-
    Only if E2 passes; seed 0 only; 1.5x Stage 2 steps on fresh prompts; not
    part of the confirmatory family.
  final_checkpoint_only: true
  rollout_n_policy: >-
    Stratified per prompt group (16 groups/step): N=2: 3 groups, N=3: 3,
    N=4: 8, N=6: 1, N=8: 1.  Slot -> N by a sha256(seed:step:slot)
    permutation; all G=8 rollouts of a group share N; advantages are within a
    group; training forward and TIS use the group's N; engine batches by N;
    N=1 groups are excluded (pass 1 is frozen).  Round 7b execution
    contingency: if the T-dial-rl memory bench shows that the N=6/N=8 groups
    do not fit the allocator cap for the chosen block, they both become N=4
    (3/3/10 over N=2/3/4) before that block's Stage 2 run.

# ---------------------------------------------------------------------------
# Architecture candidates and the pilot rule
# ---------------------------------------------------------------------------

architecture:
  loop_block_candidates: ["25-29", "16-18", "15-29"]
  bridge_candidates:
    - zero_init_norm_matched_per_channel_g
    - legacy_scalar
  # LoRA and bridge are active only on loop passes >= 2.  The first pass (N=1)
  # is the original model, bit-exactly, on every engine.
  adapters_active_from_n: 2
  adapter_sharing: >-
    One LoRA and one bridge g are shared by all passes >= 2 (time-invariant);
    pass 1 = O; there are no pass-indexed adapters and no pass embedding (its
    4-row cap would forbid N > 4).
  ple_mode: shared
  ple_mode_note: "loop_vector is forbidden: it has 4 rows and set_n_loops refuses N > 4"
  frozen_prefix: "the prelude and pass 1 run without autograd (no trainable parameter under loop_block + loop_only)"
  n_distribution: [0.0, 0.0, 0.0, 0.70, 0.075, 0.075, 0.075, 0.075]
  n_distribution_note: >-
    N = 2..8 are trained via the BPTT window (dense on 2-4); effort levels are
    1-4; N = 12, 16 are extrapolation, NLL only.  N=1 batches are not trained
    because adapters are N>=2-only.
  layer_scalar_documented: true
  kv_policy: >-
    Fixed parent KV in Part 1: consumers read the prelude cache; no per-pass KV
    is added.  Producer-block loops are exploratory only and are not run.
  lora:
    rank: 16
    alpha: 32
    dropout: 0.0
    target: >-
      All linear layers of the pilot-chosen loop block only.  LoRA scaling is 0
      on the first pass so N=1 is identical to O.  In the pilot there is one
      O-H control per candidate block-layer set (25-29, 16-18, 15-29), each
      applying the same rank-16 LoRA to that block's layers on its single pass;
      the final O-H uses the pilot-chosen L block's layers.  The same rank-16
      LoRA on the same block layers gives matched LoRA capacity, not exact
      total parameter or training-FLOP equality: L additionally carries the
      1,536-parameter recurrent bridge and the multi-exit/loop package, which
      are itemized separately.  The O-H adapter is merged (0 resident bytes) in
      its deployed form, while L's is counted unmerged because pass 1 must stay
      adapter-free.  This asymmetry is declared in section 12.
    target_option: loop_block
    lr: 2.0e-4
    bridge_lr: 3.0e-3
    loop_ple_lr: 1.0e-3
  bridge:
    primary: zero_init_norm_matched_per_channel_g
    formula: "x2 = h_pre + g * (rms(h_pre) * RMSNorm(h_prev))"
    init: "g = 0"
    params: 1536
    lr: 3.0e-3
    legacy_scalar_w0: 0.99
    scope: "loop passes >= 2 only; not on the coda"

# ---------------------------------------------------------------------------
# Dial objective (anytime multi-exit) for every L arm
# ---------------------------------------------------------------------------

dial_objective:
  exits: "coda + LM head after every pass in the window; exit 1 = O, no grad"
  window_trainable_passes: 3
  horizon: [0.0, 0.0, 0.0, 0.70, 0.075, 0.075, 0.075, 0.075]
  exit_loss: >-
    teacher forward-KL (top-64 + one tail bucket) plus 0.1 * KL(O || exit_t) at
    every exit in the window
  exit_weights: "uniform mean over the window"
  monotone_hinge:
    lambda: 1.0
    unit: "row-mean exit loss"
    pairs: "(t, t-1), t in window, t-1 in window or exit 1"
    stop_gradient_on: "t-1"
  excluded:
    - learned exit weights
    - successive-exit KL
    - fixed-point penalty
    - index-increasing weights
    - pass-indexed adapters
  logging:
    - per-exit KL_teacher
    - per-exit KL_O
    - "||g||"
    - "||h_t - h_{t-1}|| / ||h_{t-1}|| per t"
    - "period-2 ratio ||h_t - h_{t-2}|| / ||h_t - h_{t-1}||"
    - hinge activity
  oh: "unchanged single exit at N=1"
  bptt: >-
    Last k=3 trainable passes; passes 2..T-3 run under no_grad and h is
    detached at the window start.  At T=4 the window is {2,3,4}, i.e. full
    BPTT because pass 1 is frozen.  Truncation is needed only for T > 4.
  exit_coverage: "2: 70 %, 3: 77.5 %, 4: 85 %, 5-6: 22.5 %, 7: 15 %, 8: 7.5 %"

# ---------------------------------------------------------------------------
# Analytic FLOPs (per-token) and the registered r_N
# ---------------------------------------------------------------------------

flops:
  n1_total_gflop: 4.559
  # Values from gemmaloop.model.flops on the pinned E2B text config
  # (tests/fixtures/e2b_text_config.json); E4 and D3 both use these code values,
  # rounded to four decimals.
  per_pass_fraction:
    "25-29": 0.1425
    "16-18": 0.0838
    "15-29": 0.4275
  r4_rule: >-
    r_4 = 1 + 3 x the one-extra-pass fraction of N=1 matmuls, with the LM head
    included, from the code values: 2.2824 (15-29), 1.4275 (25-29), 1.2515
    (16-18).  The same four-decimal code values serve E4 and D3; the round-5
    rounded 2.29 / 1.429 / 1.252 are superseded.
  r_n:
    "25-29": {"1": 1.0, "2": 1.1425, "3": 1.285, "4": 1.4275, "6": 1.7124, "8": 1.9974, "12": 2.5674, "16": 3.1373}
    "16-18": {"1": 1.0, "2": 1.0838, "3": 1.1677, "4": 1.2515, "6": 1.4192, "8": 1.5869, "12": 1.9222, "16": 2.2575}
    "15-29": {"1": 1.0, "2": 1.4275, "3": 1.8549, "4": 2.2824, "6": 3.1373, "8": 3.9922, "12": 5.7021, "16": 7.4119}
  accounting: >-
    Useful analytic per-token FLOPs including exit-check costs are the
    registered measure; executed FLOPs and wall clock are reported alongside.
    Attention-score FLOPs are excluded from the headline and reported as a
    sensitivity (at 8-32k context a full-attention consumer layer's score
    FLOPs are about as large as its matmuls).  D3 remains a secondary FLOPs
    frontier, never the intelligence-per-byte metric.

# ---------------------------------------------------------------------------
# Stage 1: heal
# ---------------------------------------------------------------------------

stage1:
  teacher:
    candidates:
      - google/gemma-4-E4B-it
      - google/gemma-4-12B-it (Google QAT q4_0 checkpoint)
    selection: >-
      Teacher first: the pilot chooses E4B or the 12B QAT 4-bit checkpoint by
      the mean calibrated-NLL gain over O of (25-29+gch+T) measured at L's
      primary N=4 and (O-H[25-29]+T) at N=1, with an E4B tie-break within
      0.003 nats.  The O-H comparison uses the same block layers as the
      25-29 L arm.  Bigger is not assumed to be better because of the
      teacher-student capacity gap.
    objective: >-
      See dial_objective: anytime multi-exit supervision.  Forward KL from the
      same-tokenizer teacher on O's own samples, computed offline as top-k
      logits plus one tail bucket, plus 0.1 * KL to the parent at every exit in
      the window.
    beta_parent_kl: 0.1
    parent_kl_direction: "KL(parent || student)"
    parent_kl_live: true
    parent_kl_at_every_exit: true
    top_k: 64
    top_k_tail: >-
      One tail bucket: teacher probability mass outside the top-k, compared
      with the student's mass outside the same top-k, so the KL is a proper
      divergence rather than a truncated approximation.
    teacher_temperature: 1.0
    logits_dtype: float16
    logits_precomputed_offline: true
    vocab_mask_token: "<glitch_pruned_249788>"
    same_teacher_for_oh: true
  oh_runs_stage1: true
  oh_stage1_note: >-
    O-H runs the same teacher, data and 12M-token budget as L.  Its rank-16
    LoRA on the same block layers trains (matched LoRA capacity); O-H carries
    no recurrent bridge and no multi-exit/loop package, and the Stage 1 cost is
    charged to both arms.
  data: >-
    O's own samples from the Stage 0 train bucket, at most 8192 tokens per row;
    no verification is needed because the target is the teacher's distribution.
    O-H receives the same teacher and the same rows.
  budget_tokens: 12000000
  dose_logging_interval: 2000000
  dose_logging_role: >-
    descriptive only; no decision use; the budget stays fixed at 12M.
  # Round 8c: main-training lineage, dose accounting and shortfall.
  initialization: >-
    Main Stage 1 restarts from O for both L and O-H.  The 3M pilot heals are
    selection-only and their weights are never continued into the main run.
    Stage 2 starts from the final main Stage 1 checkpoint of the same arm, not
    from a pilot heal.
  token_accounting: >-
    The registered 12M-token Stage 1 dose counts rendered input tokens.  Report
    separately the rendered input tokens, the scored assistant tokens (thinking
    plus answer) and the repeated multi-exit targets; these are different cost
    denominators.  The 3M pilot exposure is selection-only and is never added
    to the 12M dose or described as part of it.
  dose_shortfall_rule: >-
    If the frozen train rows contain fewer than 12M rendered input tokens,
    cycle the same frozen row order to exactly the 12M budget (the same rule as
    the Stage 2 prompt cycle) and record the realized epochs.  Never add an
    unregistered epoch or borrow rows from another split.  Zero usable rows
    stops before Stage 1 and issues a new disclosed version.
  # Round 7d: the registered optimizer is bitsandbytes 8-bit AdamW
  # (adamw_8bit) on GPU for every arm and stage that trains.  The field keeps
  # the legacy "AdamW" spelling so the loader stays compatible; the resolved
  # optimizer is recorded in run.json (code change on branch fix/optim-record).
  optimizer: AdamW
  # Round 7c: per-device batch 1 row x gradient accumulation 16 rows per
  # optimizer step.  rows_per_optimizer_step replaces the old
  # tokens_per_optimizer_step, which the schema still accepts (backward
  # compatible) but the trainer does not read.  The measured tokens per
  # optimizer step are recorded in run.json (about 26k at the audited mean
  # row length of about 1,650 tokens).
  rows_per_optimizer_step: 16
  gradient_clip: 1.0
  schedule: "token-cosine with 3% warmup, ends exactly at the 12M budget"
  recipe_binding: >-
    Under --prereg the trainer reads the Stage 1 recipe from prereg.yaml:
    the optimizer is bitsandbytes 8-bit AdamW (adamw_8bit) on GPU for every
    arm and stage that trains; the yaml field keeps the legacy "AdamW"
    spelling, which the loader maps to adamw_8bit (adamw_torch only on CPU
    dev runs), and run.json records the resolved optimizer (code change on
    branch fix/optim-record).  LoRA LR 2e-4 (architecture.lora.lr), bridge LR
    3e-3 (architecture.lora.bridge_lr), loop_ple LR 1e-3
    (architecture.lora.loop_ple_lr), gradient clip 1.0, 3 % warmup,
    per-device batch 1 row, and rows_per_optimizer_step 16.  A CLI override
    of any of these is refused (exit 2).  The token-cosine schedule is token-based and
    unchanged; the measured tokens per optimizer step are recorded in
    run.json.
  loss_tokens: "assistant tokens only (thinking + answer)"
  teacher_runtime: >-
    E4B bf16 with CPU PLE (text-only, vision tower off GPU) primary, E4B
    LLM.int8 fallback; 12B loaded from Google's QAT-unquantized checkpoint with
    bitsandbytes NF4 (double quant, bf16 head) primary, the official Google QAT
    Q4_0 GGUF executed through llama.cpp as the registered fallback.  One
    frozen runtime per teacher, shared by that teacher's L and O-H.
  numerics: >-
    The E4B teacher is evaluated in bf16 with the PLE table resident on CPU
    (5.250 GiB) and the tied embedding/head counted once; the 12B teacher uses
    bitsandbytes nf4 (NF4, double quant) with a bf16 head.  The teacher is not a vendor Q4_0
    execution unless the llama.cpp fallback is qualified.  The student/trainer
    numerics are declared in run.json (bf16 weights, fp32 bridge arithmetic for
    N>1).  Multi-exit KL kernel: the parent LSE is computed once per step and
    the parent tile is recomputed per exit.
  description: >-
    The parent KL is computed live, full-vocab, with adapters off at N=1.  The
    teacher's top-k and tail shards are precomputed once offline.
  runtimes:
    e4b: >-
      bf16 with CPU PLE, text-only, vision tower off GPU; the tied
      embedding/head counted once.  Resident text weights ~8.65 GiB (8.753 GiB
      GPU-side text + 5.250 GiB CPU PLE); verify the 8,192-token forward
      against the ~10.28 GiB working cap.  Int8 fallback: bitsandbytes LLM.int8
      with bf16 embedding/head, CPU PLE, vision tower skipped.
    "12b": >-
      Google/gemma-4-12B-it-qat-q4_0-unquantized at b6ed862 loaded with
      bitsandbytes NF4 double quant and a bf16 (unquantized, tied) head;
      ~7.1 GiB resident weights.  Registered fallback: the official Google QAT
      Q4_0 GGUF executed through llama.cpp with f16 K/V, full GPU layer
      offload, sliding-aware cache allocation and a bounded all-position
      exporter (physical batches 128-256); the exporter is implemented only if
      NF4 fails qualification.
  runtime_qualification: >-
    Freeze the qualification procedure and the backend decision order before
    examining any trained-arm endpoint.  Each teacher is qualified on ~20
    development/train-pool rows chosen deterministically from O's Stage 0 local
    samples (train bucket, verified rows, stratified 4 short / 8 common / 4
    medium / 4 long = 4/8/4/4) and disjoint only from the registered protected
    sets (pilot evaluation, T-fit, MONITOR and confirmatory); train-pool rows
    are allowed.  The 20-row screen expands once to 100 rows in seeded
    sha256(seed:request_id) hash order under the same thresholds, plus a
    synthetic 8,192-token memory smoke for allocation and causal-boundary
    checks only (never fidelity reporting).  The student token IDs, assistant
    mask and position alignment are preserved exactly.  The
    reference for each teacher is the same checkpoint in bf16 with full
    context and the same head policy, mask, softcap and temperature; for 12B
    the reference is CPU bf16 weights/compute where supported or controlled
    sequential bf16 GPU offload for this small job only.  A regular 12B model,
    or four-bit weights dequantized back to bf16, is not the bf16 reference.
  qualification_corpus: >-
    Rows are drawn from O's Stage 0 local samples on the train bucket (verified
    rows, stratified 4 short / 8 common / 4 medium / 4 long = 4/8/4/4, 20-row
    screen; expansion to 100 rows in seeded sha256(seed:request_id) hash
    order), never selected by teacher losses.  They are disjoint only from the
    registered protected sets (pilot evaluation, T-fit, MONITOR and
    confirmatory); train-pool rows are allowed.  The 120-row P1-lite corpus is
    the registered fallback, but after protected-set filtering it keeps only
    85 rows, so it cannot reach the 100-row expansion; a shortfall fails closed
    (exit 2), it never shrinks the 20-row screen.
  qualification_fallback: >-
    Fallback order for the corpus itself: (1) Stage 0 local samples, preferred
    and CPU-only; (2) the existing 120-row P1-lite corpus (85 rows kept after
    protected filtering) extended on GPU by hash-ordered sampling to at least
    140 verified rows before the 20-row screen is taken.  The synthetic
    8,192-token memory smoke is added to either corpus for allocation and
    causal-boundary checks only.
  qualification_references: >-
    Same-checkpoint bf16 reference with full context and the same head policy,
    mask, softcap and temperature; for 12B, CPU bf16 or controlled sequential
    bf16 GPU offload for this small job only.  Retain reference final hidden
    states on CPU, release the transformer, then stream head comparisons in
    small tiles; one reference process at a time with RAM inspected first.
  qualification_metrics: >-
    Full forward KL KL(p_bf16 || q_runtime) (and reverse KL if full vectors are
    available) with stable full-vocabulary normalisation before storage
    rounding; distillation-relevant common-support KL on the union of each
    distribution's top-64 IDs plus one residual bucket, and the 65-way KL on
    bf16's top-64 support; top-1 agreement overall and on confident reference
    tokens (post-softcap top-1/top-2 gap >= 0.5 logit); top-64 overlap and
    bf16 mass captured; mean and p95 absolute tail-mass error; entropy
    difference and signed/absolute difference in teacher-forced log p(O's
    actual next token), thinking and answer spans reported separately; repeat
    after fp16 top-k serialisation and the trainer's fp32 renormalisation.
    Use fp64 accumulation, token-weighted results and row-level dispersion
    with a problem/row-cluster bootstrap interval.
  acceptance_table:
    - "Mean full forward KL (or union-support KL only if full KL is technically unavailable and explicitly disclosed) <= 0.010 nat per supervised token"
    - "Upper 95 % row-bootstrap bound for that mean <= 0.015 nat"
    - "p95 per-token KL <= 0.050 nat"
    - "Top-1 agreement >= 95 % overall and >= 99 % on confident reference tokens"
    - "Absolute tail error on the fixed reference top-64 support: mean <= 0.002 and p95 <= 0.010"
    - "All tensors, positions, IDs, masks and sums valid; no NaNs; correct normalisation/alignment"
    - "Long-row allocation below the actual cap with >= 0.25 GiB allocator headroom, no steadily growing allocation across rows/shards and no system-memory spill"
  expansion_rule: >-
    If the initial 20-row result is within 20 % of any boundary or has a
    length/span-specific failure, expand once to 100 predetermined development
    rows under the same thresholds.  Do not keep sampling until it passes.  If
    it still fails, move to the next prespecified runtime; if all fail, fail
    closed and stop before the pilot, never weaken validation or spill dense
    weights into system RAM.
  fallback_order:
    - "E4B bf16 with CPU PLE (primary)"
    - "E4B bitsandbytes LLM.int8 with bf16 embedding/head and CPU PLE"
    - "12B NF4 from the QAT-unquantized checkpoint (primary for 12B)"
    - "12B official QAT Q4_0 GGUF through llama.cpp (registered fallback; exporter only if NF4 fails)"
    - "stop before the pilot if no resident runtime meets the acceptance rule; a change to the registered representation or fallback order is a new disclosed version, not an in-round repair"
  manifest_identity: >-
    The teacher manifest identity includes method and settings, compute dtype,
    skipped modules, head projection/accumulation policy, attention
    implementation, software versions, chunk sizes and any KV dtype; for GGUF
    it also includes the full file hash, upstream revision and conversion/build
    identities.  Reusing a shard after changing any of these semantics must
    fail closed.  TeacherSpec is bound to the chosen runtime, not a broad
    accept-any-quant whitelist; validate_teacher_manifest_identity and the
    resume identity must accept the chosen runtime and reject the others.
  comparison_rule: >-
    The teacher comparison is the best qualified resident runtime per teacher
    under the same acceptance rule, exact O samples, tokenizer/mask, 8,192
    context, temperature, target positions and storage format.  There is no
    need to quantise an E4B that can run in bf16 merely to share a label with
    12B.  Freeze one runtime for each teacher before the pilot and use that
    exact shard set for that teacher's L and matching O-H; never alternate
    NF4/Q4_0 within one teacher corpus, switch backend after observing pilot
    gains, or train O-H on a different runtime's outputs.
  four_bit_limitation: >-
    The 12B candidate is Google's QAT-unquantized checkpoint loaded with
    bitsandbytes NF4, which is the registered evaluated representation; it is
    not automatically the vendor's Q4_0 execution or its reported score.  E4B
    is evaluated in bf16 (int8 fallback), so the older "both teachers are
    four-bit" statement is retired.  The top-64 float16 logits plus tail
    bucket approximate the full distribution, and the capacity gap may hurt.
    The glitch token is masked.
  execution_repair: >-
    X3-C1 execution repair (registered; changes no estimand): freeze every
    loaded teacher parameter, wrap the entire production precompute including
    the head in torch.inference_mode() (or no_grad), detach stored probability
    and tail tensors explicitly, and test that outputs have no grad_fn and no
    saved autograd tensors.  The loaded bf16 embedding/tied head must not
    require grad; an unquantized head outside the no-grad scope can retain
    fp32 [8192, 262144] graphs (~8 GiB) and defeat either quantisation.  The
    repair lands before any teacher corpus is written, and a shard whose
    manifest does not bind the inference-mode/head policy fails closed.
  freeze_rule: >-
    Teacher qualification runs after the prereg-v1 tag and before the pilot,
    fail-closed: an incompatible, unavailable or failing registered runtime
    stops before the pilot, with no pilot, no representation substitution and
    no relaxed threshold.  A registered fallback runtime that itself passes
    qualification is not a new representation amendment; any other change to
    the teacher representation or fallback order requires a disclosed new
    prereg version.  The runtime choice is frozen before the pilot, and the
    qualification result and runtime/manifest identity are recorded in the
    pins addendum before any trained-arm evaluation.  The runtime is not a
    post-pilot knob.

# ---------------------------------------------------------------------------
# Stage 2: Dr. GRPO RLVR
# ---------------------------------------------------------------------------

stage2:
  algorithm: Dr. GRPO
  library: TRL 1.17.1 GRPOTrainer
  rollout_n_policy: >-
    Stratified per prompt group: per step 3 groups at N=2, 3 at N=3, 8 at N=4,
    1 at N=6 and 1 at N=8 (16 groups).  Slot -> N by a sha256(seed:step:slot)
    permutation, so prompt order and difficulty do not line up with N; all G=8
    rollouts of a group share N; advantages are within a group; the training
    forward and TIS use the group's N; the engine generates in five per-N
    batches; N=1 groups are excluded (pass 1 is frozen, so they carry no
    gradient).  Round 7b/7c deviation D-7b: if the T-dial-rl memory bench
    shows that an N=6 or an N=8 step does not fit the allocator cap for the
    chosen block, both groups become N=4 (mix 3/3/10 over N=2/3/4).  T-dial-rl
    ships and runs its own memory bench before any Stage 2 run; the
    T-dial-bench Stage 2 proxy is not the trainer.
  rollout_n_groups: {2: 3, 3: 3, 4: 8, 6: 1, 8: 1}
  rollout_n_fallback_policy: >-
    Disclosed deviation D-7b (pre-tag, after Stage A was shown to the author):
    if the T-dial-rl memory bench shows that a Stage 2 N=6 or N=8 step does
    not fit the allocator cap for the chosen block, both groups become N=4
    (3/3/10 over N=2/3/4).  This changes the registered training-recipe field
    rollout_n_groups; it changes no endpoint, selection or analysis rule, and
    analysis_rules_frozen_at_commit stays 8c6d78d.  The trigger is measured
    memory (perf/dial_bench.json, sha256 ab91b834...); Stage A content is not
    an input.  The T-dial-bench Stage 2 proxy OOM does not by itself trigger
    the fallback.
  rollout_n_fallback_groups: {2: 3, 3: 3, 4: 10}
  t_dial_rl_memory_bench: >-
    T-dial-rl ships and runs its own memory benchmark before any Stage 2 run.
    Configuration fixed now (round 7d): the three candidate blocks (25-29,
    16-18, 15-29); N=6 and N=8; a row of 10,240 tokens (the 2,048-token Stage 2
    prompt cap plus the 8,192-token completion cap, which is the longest real
    Stage 2 row); the last-k=3 trainable window; prelude and pass 1 under
    no_grad; the chunked head; and the registered gradient accumulation (16).
    "Fits" means one full optimizer step completes with no OOM and peak
    reserved memory below the allocator cap (10.28 GiB on the bench device).
    The bench and its sha256 are committed in a pre-Stage-2 addendum.  Its
    result, not the round-7b proxy, decides whether the 3/3/10 fallback mix
    applies.
  feasibility_bench: >-
    Round 8 (X1 item 4): before either main Stage 2 arm, T-dial-rl's own
    memory bench runs on the real trainer at the actual 10,240-token maximum
    row (2,048-token prompt cap + 8,192-token completion cap).  It covers O-H
    at N=1 and L at the mandatory N=2, N=3 and N=4 paths, as well as N=6 and
    N=8.  The bench uses checkpointing, the registered last-k=3 backward, the
    chunked head, the actual optimizer (bitsandbytes adamw_8bit), all stored
    old/engine logprobs and masks, and the actual rollout/update batching.  It
    performs one warm-up and one complete update so lazily allocated optimizer
    state is represented.  The command, resolved configuration, code hash and
    result are a registered deliverable published before either arm.
  mandatory_paths: >-
    O-H (N=1) and L at N=2, 3 and 4 are mandatory; N=6 and N=8 are optional
    according to deviation D-7b.  A smaller N is not a general remedy for
    logits/rollout-buffer/optimizer memory overhead.
  rollout_storage: >-
    The bench accounts for the actual stored rollout buffers: prompts,
    completions, per-token old and engine logprobs, masks, rewards, all G=8
    rollouts per group and the per-N batch layout.  Stored logprobs are not
    silently dropped to make a path fit.
  optimizer_state: >-
    The bench accounts for the actual two-moment 8-bit AdamW optimizer state
    for every trainable LoRA/bridge parameter, allocated by a complete update,
    not only by a forward or a warm-up step.
  fallback_must_fit: >-
    D-7b's 3/3/10 fallback (both high-N groups become N=4) must itself fit
    under the same real-trainer bench.  A fallback that does not fit is not a
    fallback.
  mandatory_stop_rule: >-
    If a mandatory path (O-H at N=1 or L at N=2/3/4) does not fit at the
    10,240-token maximum, STOP before either main Stage 2 arm and issue a new
    disclosed prereg version.  Do not shorten one arm, silently discard long
    rows, substitute another N mix, raise the cap, or classify a permanent OOM
    as a crash to retry indefinitely.  Repeated-step stability is an execution
    preflight after the one-step "fits" trigger.
  bptt_window: >-
    The policy-gradient backward uses the same last-k=3 trainable-pass window
    for every N: passes <= N-3 run under no_grad and the hidden state is
    detached at the window start.  Full BPTT is not registered.  At N=4 this is
    the full window because pass 1 is frozen.
  dial_monitoring: >-
    Dev-split calibrated NLL at N in {2,4,8} every 25 steps; descriptive only,
    with no stopping rule (to avoid a forking path).
  oh_rollout_n: 1
  prompts_per_step: 16
  group_size: 8
  steps: 100
  completion_cap: 8192
  # Round 7d: prompts above 2,048 tokens are excluded from the Stage 2 pool at
  # selection time, identically for both arms.  A Stage 2 row is therefore at
  # most 2,048 + 8,192 = 10,240 tokens.
  prompt_cap: 2048
  # Round 7d: bitsandbytes 8-bit AdamW (adamw_8bit) on GPU, the same
  # registered optimizer as Stage 1.  The field keeps the legacy "AdamW"
  # spelling for loader compatibility; run.json records the resolved optimizer.
  optimizer: AdamW
  lora_lr: 2.0e-5
  bridge_lr: 1.0e-3
  beta_kl: 0.0
  tis_cap: 2.0
  num_iterations: 1
  dr_grpo_normalizer: 8192
  grader_timeout_s: 6
  sampling:
    temperature: 1.0
    top_p: 1.0
    top_k: 0
    max_new_tokens: 8192
    enable_thinking: true
  reward: >-
    1 if every hidden test passes in the sandbox, or the exact answer matches
    via math-verify; otherwise 0.  No format or length reward.
  verifiers: >-
    Programmatic only: unit tests for code and exact answers for math, run in a
    CPU-only sandbox.  Hidden tests are written offline by DeepSeek V4.1 Flash
    once and shared by both arms; tests that the reference solution fails are
    dropped.
  prompt_selection: >-
    Prompts are picked once from O's Stage 0 pass rates (1-3 of 4 correct),
    with a rendered prompt length <= 2,048 tokens: prompts above the Stage 2
    prompt cap are excluded from the Stage 2 pool at selection time,
    identically for both arms.  This cap is a new selection rule (D-7c), not a
    correction to a recipe already in use; the prereg-v1-data addendum records
    the number of prompts it excludes and its interaction with the 1,600-prompt
    cycling rule.  The pool is decontaminated; the same prompts and order are
    used for O-H and L.  The longest training row is therefore
    2,048 + 8,192 = 10,240 tokens, and Stage 2 rows are not filtered by
    max_length (which applies to Stage 1, the pilot heals and RFT).
  prompt_shortfall_rule: >-
    If between 1 and 1,599 prompts qualify, cycle the qualifying set in the
    same order for both arms.  If zero prompts qualify, do not borrow from the
    train, NLL or held-out splits, do not relax the pass-rate or 2,048-token
    cap, and do not add epochs: stop before either main Stage 2 arm and report
    Stage 2 not run.  The registered RFT fallback is used only if the P3 keep
    rule already selected it; otherwise a Stage 2 run requires a new disclosed
    version.
  initialization: >-
    Stage 2 starts from the final main Stage 1 checkpoint of the same arm (L or
    O-H), which itself restarted from O.  A pilot heal is never continued into
    Stage 2.
  truncation: >-
    Rollouts at the 8192 cap are masked from the loss but counted; truncation
    rate is logged per arm.
  same_for_both_arms: true
  engine: >-
    Round 8c: the padded adaptive-batch HF engine is the sole operative
    Part 1 engine for Stage 2 and all evaluation, same for O, O-H and L.  The
    refill track is closed for prereg-v1; the engine_gate and part_b blocks are
    inactive historical records with no execution authority.  The padded
    implementation is pinned in pins.padded_engine_source.  N is fixed per
    engine batch (the five per-N batches of the stratified policy), not per
    arm; N=1 bit-exactness is checked against stock HF.  The historical gate
    design covered Stage 2 rollouts at N=2, 3, 4, 6 and 8, sampled parity at
    N=4 and every Stage 2 N, and throughput at N=1 and N=4; those records
    authorize no refill run.
  deepseek:
    model: deepseek-flash
    served_version: DeepSeek-V4.1-Flash-1017
    fingerprint_record: artifacts/stage0/deepseek_fingerprint.json
    api: official DeepSeek Open Platform API only
    uses:
      - writing hidden tests for weakly tested problems (shared by both arms)
      - auditing rollouts for reward hacking (reported, never a reward)
      - creative judge in Part 2
    never:
      - a reward in Part 1
      - a target in Part 1
      - a source of training data in Part 1
    opencode_hosted: never for anything that enters training or results
    terms: >-
      DeepSeek Open Platform terms section 4.2(3) allow training other models
      (distillation) and section 4.2(2) assigns output rights to the user
      (effective 2026-04-29).  OpenCode Zen free usage is only for plumbing or
      dry-run tests whose outputs are discarded.
  fallback_rft:
    data: "O's verified-correct self-traces from the Stage 0 train bucket"
    tokens: 12000000
    optimizer: AdamW
    lora_lr: 2.0e-4
    bridge_lr: 3.0e-3
    schedule: "token-cosine with 3% warmup, ends exactly at the 12M budget"
    loop_probs: [0.0, 0.0, 0.0, 0.70, 0.075, 0.075, 0.075, 0.075]
    loss: "multi-exit CE at the window exits, uniform weights, same hinge"
    description: >-
      Registered now so that using the P3 fallback is not a deviation: RFT is
      supervised fine-tuning on O's verified-correct self-traces with the same
      LoRA/bridge/schedule and dial objective as Stage 1, the same registered
      bitsandbytes 8-bit AdamW (adamw_8bit on GPU; the field keeps the legacy
      "AdamW" spelling), no teacher KL, and the same evaluation.

# ---------------------------------------------------------------------------
# Endpoints and statistics
# ---------------------------------------------------------------------------

endpoints:
  precondition:
    id: E1
    name: "precondition: bit-exact L(N=1) and heal estimates"
    test: >-
      L(N=1) is bit-identical to O on every engine used (HF trainer and the
      evaluation engine).  Heal effects on O-H and L are reported as estimates
      with intervals, not as a gated TOST.
    margin: "no alpha, no gate"
    bootstrap: "problem-cluster bootstrap for the descriptive estimates"
  sequence:
    - id: E2
      name: "E2 loop effect at the primary N=4"
      test: >-
        L(N=4) - O-H on the full LiveCodeBench release_v6 (1,055 items, one
        sample per seed); the 182 post-cutoff items are a pre-specified
        subgroup.  Primary endpoint.  L(N=2) is also run on the full LCB as
        the paired D2 baseline, not as a confirmatory endpoint.  E2 compares
        the complete looped training/inference package (multi-exit supervision
        and hinge, the extra bridge, different RL depth strata and additional
        inference computation) with this matched-data, matched-layer adapter
        control; it is not the pure causal effect of recurrence with every
        training and compute factor held fixed.
      margin: "one-sided alpha 0.02 (96% CI) lower bound > 0; 0.025 (95% CI) after D1 is rejected"
      bootstrap: "paired problem-cluster bootstrap"
    - id: E3
      name: "Total effect versus O: training + loops, L(N=4) - O"
      test: >-
        L(N=4) - O on the same items.  Since L(N=1) is O bit-exactly, this is
        the total training-plus-loop effect versus the original, not a clean
        loop contrast; E2 is the loop contrast.
      margin: "one-sided alpha 0.02 (96% CI) lower bound > 0; 0.025 (95% CI) after D1 is rejected"
      bootstrap: "paired problem-cluster bootstrap"
    - id: E4
      name: "budget-curve AUC at the primary N=4"
      test: >-
        The grid is defined on O-H's budget so both arms stay at or below the
        32,768 generation cap: O-H at B = 1024 * 2^j, j = 0..5, and L at
        floor(B / r_4), with r_4 = 2.2824 (15-29), 1.4275 (25-29) or 1.2515
        (16-18) from the code.  A completion counts as correct at a budget only
        if it is solved with total tokens <= that budget.  Both arms are
        re-scored from saved completions and both stay <= 32,768 (no capped
        arm).  AUC is the trapezoid over j divided by 5.
      margin: "one-sided alpha 0.02 (96% CI) lower bound of the AUC difference > 0; 0.025 after D1 is rejected"
      bootstrap: "paired problem-cluster bootstrap over items"
  primary: E2
  multiplicity: >-
    Graphical approach (Bretz et al. 2009), one-sided alpha 0.025 in total.
    Initial weights w = 0.025 x (E2: 0.8, E3: 0, E4: 0, D1: 0.2), i.e. E2
    starts at 0.02 and D1 at 0.005.  Transitions E2 -> E3 = E3 -> E4 =
    E4 -> D1 = D1 -> E2 = 1.  E_{k+1} receives alpha only after E_k is
    rejected; there is no "stop at the first failure".  One-sided
    percentile-bootstrap p-values use 10,000 iterations, seed 0; D1's p-value
    is the maximum over its four component p-values.  Final decisions are taken
    after the algorithm terminates; the result does not depend on the order.
    MDE at 1,055 items rises from 5.57 to 5.75 pp if D1 fails; D2-D6 are
    estimation only.
  graphical:
    method: "Bretz, Maurer, Brannath and Posch 2009, Algorithm 1 (weighted Bonferroni graph)"
    total_one_sided_alpha: 0.025
    weights: {E2: 0.8, E3: 0.0, E4: 0.0, D1: 0.2}
    transitions: {E2: E3, E3: E4, E4: D1, D1: E2}
    p_values: >-
      One-sided percentile-bootstrap p-values, 10,000 iterations, seed 0,
      paired problem clusters; D1 p = max of its four component p-values
      (gain and the three adjacent regressions).
    operational_order:
      - "Test D1 at 0.005."
      - "Run the E sequence at 0.025 if D1 was rejected, otherwise at 0.02."
      - "If E2-E4 are all rejected and D1 was not, test D1 at 0.025."
    decision_rule: >-
      Final decisions are taken after the algorithm terminates; recycling is
      order-independent.
  dial_family:
    - id: D1
      name: "D1 dial monotonicity (confirmatory)"
      status: confirmatory
      test: >-
        Intersection-union test (Berger 1982): reject the null only if all four
        component tests reject at alpha_D.  (a) Gain cNLL(1) - cNLL(4) > 0.
        (b) No adjacent regression cNLL(N+1) - cNLL(N) < m = 0.005
        nats/token for N = 1, 2, 3.  No within-D1 adjustment is needed.  D1 is
        an average calibrated-likelihood gain and non-inferiority result on
        O-verifiable math traces only; it is not a general "usable reasoning
        dial", not per-token monotonicity, and not a guarantee for hard
        problems O cannot solve, code, arbitrary N or generated continuations.
        A D1 pass alone must not produce the headline "a usable reasoning
        dial" or "every extra loop helps".
      corpus: >-
        O's dedicated sampling on the scored NLL test bucket 62-69 (400
        problems), SEPARATE from the Stage 0 training pool (bucket 0-49): four
        samples per problem with the registered sampling, kept only if the
        sample passes the Stage 0 filter and its answer is verified - math via
        math-verify; code problems are excluded because no hidden-test harness
        is registered for this corpus, and chat is excluded.  The lowest-index
        verified-correct trace per problem is scored.  The realized bucket
        60-61 fit split has 90 problems (40 math) and bucket 62-69 has 396
        problems (162 math); these are inputs before verification and length
        exclusions, not retained D1 rows.  Bucket 60-61 is the separate
        temperature-fit split.  The dedicated 60-69 fit/test targets are an
        explicit post-tag, pre-pilot `prereg-v1-data` obligation: they are
        generated by the registered Stage 0 data sampler (Modal stock vLLM
        v0.30.0 for the main run when approved/available, otherwise the local
        padded adaptive-batch HF engine; the data-generation engine is recorded
        per row and is not an evaluation engine), with the registered sampling
        (temperature 1.0, top_p 0.95, top_k 64, thinking on), four samples per
        problem, max_new_tokens 32768 and the Stage 0 rendered-length filter of
        8192; their trace IDs, verifier outcomes and counts are frozen in the
        data addendum before any trained-arm score.  The Stage 0 training-pool
        sampler does not cover these buckets.
      temperature: >-
        One temperature per (arm, checkpoint, N), fitted on bucket 60-61 with
        the single registered estimator described in endpoints.nll_analysis
        (the same estimator used in the pilot).  D1 and D5 run at both L-heal
        and L-final; the checkpoint is part of the key.
      bootstrap: "paired problem-cluster bootstrap, 10,000 iterations, one-sided percentile p-values"
      checkpoint: "L final (L-heal descriptive)"
      margin: "IUT at alpha_D = 0.005; m = 0.005 nats/token"
  estimation:
    - "D2 (estimation, no gate): L(N=4) - L(N=2) on the full LCB 1,055 x 1 with the paired 95% CI and the non-inferiority margin of -3 pp reported but not gated.  This is the extra-depth effect of N=4 over N=2; a flat tail or a non-significant difference is reported as a plateau or an unresolved effect, never as proof that every extra loop helps.  L(N=1) needs no run (it is O's run).  The paired SE estimate is 1.2-1.4 pp with 15-20 % discordant items, so a superiority claim of a few pp is out of reach."
    - "D3 (estimation): effort levels and the FLOPs frontier.  Accuracy at N = 1, 2, 4 on the full LCB and N = 3 on the ladder items; the budget surface acc_L(N, B) from saved completions (B = 1k..32k, as in E4); the FLOPs-matched Pareto frontier max_N acc_L(N, F/r_N) versus acc_O-H(F), as an AUC difference with CI.  This is the loops-vs-thinking-tokens comparison and a secondary FLOPs axis, never the intelligence-per-byte metric."
    - "D4 (estimation, exact, teacher-forced likelihood evidence only): hidden-change rule (epsilon fitted for mean N_eff = 2, 3 and 4) and the exit-1 entropy gate (tau fitted to match the analytic FLOPs of fixed N=2, check cost included), each versus fixed N at matched analytic FLOPs.  Define delta cNLL = cNLL(fixed N) - cNLL(policy); for each token use the per-(arm, checkpoint, exit-N) temperature of the exit that produced it.  Reports delta cNLL with a 95% problem-cluster CI and the oracle bound.  The winning policy is chosen by the rule fixed now: the policy with the largest mean delta cNLL at matched analytic FLOPs whose 95% problem-cluster CI lower bound is > 0, ties to the lower mean bytes read per token, then to hidden-change (the cheaper check).  If no policy qualifies, auto = fixed N=4 and the table reads 'no adaptive winner'.  The winner is selected on the same scored data, so its selected delta cNLL and interval are labelled exploratory/selected/optimistic, not an unbiased selected-policy interval; the winner enters the per-byte table as a selected estimate and becomes only a provisional Part 2 'auto' serve map pending fresh-data validation before any serving claim.  D4 provides teacher-forced likelihood evidence only: it cannot turn the same saved completions into the policy's generated answers, so adaptive-decode accuracy is unmeasured in Part 1 and remains a named Part 2 milestone."
    - "D5 (estimation): cNLL at N = 6, 8 (trained) and N = 12, 16 (untrained); collapse flag if cNLL(N) > cNLL(1) + 0.05; the ||delta h_t|| curves and the period-2 ratio."
    - "D6 (estimation only, no gate): see the byte frontier in intelligence_per_byte.d6."
  heal_estimates:
    nll_nats: 0.01
    lcb_pts: 3.0
    ci_level: 0.90
    gate: false
  nll_analysis:
    supervised_token_mask: >-
      Score assistant thinking plus answer tokens with a fixed mask.  The same
      retained problems and the same mask are used at every exit and
      checkpoint (L-heal and L-final).
    weighting: >-
      Primary: token-weighted NLL with problem-level resampling.  Define
      C_N = sum_i S_iN / sum_i n_i, where S_iN is the summed calibrated token
      loss and n_i the scored token count for the single retained trace of
      problem i.  Token counts travel with their problem under resampling;
      independent-token resampling is forbidden.  An equal-problem averaging
      alternative is declared but not used; if used it would have to be
      declared before the tag because the two estimands can rank arms
      differently.
    statistic: >-
      Positive-oriented statistics T_gain = C_1 - C_4 and
      T_adj,N = 0.005 - (C_(N+1) - C_N) for N = 1, 2, 3.  Resample paired
      problems and recompute each ratio statistic keeping the token counts
      with each problem.  D1 uses the maximum of the four component p-values.
    p_value: >-
      One-sided percentile-bootstrap p-value p = (1 + number of bootstrap
      T* <= 0) / 10001 for these positive-oriented statistics, with
      conservative tie treatment.  Equality at alpha is non-rejection.
      Percentile interpolation: the empirical bootstrap distribution is used
      without interpolation; the p-value is not an exact finite-sample
      guarantee.  D1's p-value is the maximum of its four components and uses
      the same construction.
    temperature: >-
      Bind one estimator in both the pilot and confirmatory scoring:
      gemmaloop.eval.calibrated_nll.fit_model_temperature (equivalently the
      model path of calibrated_nll_report), the model-level path, NOT the
      tensor helper with its different defaults.  Algorithm: one scalar
      temperature per (arm, checkpoint, N), minimising mean NLL (fp32) by a
      bounded golden-section search on the positive half-line.  Bounds
      (0.5, 4.0); max_iter = 40; tol = 5e-3.  Source pin: commit
      54cab07670cee56bd100103d0f16ec869bfd5cf4, blob
      f51de454546b89018cf4012921f06f6331403c57 of
      src/gemmaloop/eval/calibrated_nll.py (pins.temperature_fit_algorithm);
      round 8c changes no code.  Fit only on the independent fit split (bucket
      60-61); the primary bootstrap holds the fitted temperatures fixed and
      inference is conditional on them.  A separate fit-split-resampling
      sensitivity is optional.  The test loss never chooses a calibration fit.
      Failure behaviour: an empty labelled fit set raises before a fit; a
      non-finite objective, a malformed/mismatched denominator, or a fit whose
      result cannot be applied makes that comparison unevaluable.  A fit that
      ends on a bound is reported explicitly as a boundary fit and is not
      silently widened; no alternative estimator, refit on the test split or
      post-result tuning is allowed.
    unevaluable_corpus: >-
      Freeze trace IDs, verifier outcomes, lengths, actual distinct-problem
      counts and exclusions in the data addendum before any trained-arm
      scoring.  A usable fit corpus requires at least 20 verified distinct
      problems and a usable score corpus at least 40; an empty or below-minimum
      fit or score corpus produces D1 unevaluable: no rejection, no alpha
      transfer from D1, and no post-result replenishment or substitution.  The
      realized fit bucket has 90 problems (40 math) and the score bucket 396
      (162 math), but these are input counts, not retained verified traces;
      the usable verified math subset is expected to be about 80-110 problems
      before length exclusions and D1 power is unestablished.
    fit_test_freeze: >-
      The realised fit/test trace IDs and counts are frozen in the
      prereg-v1-data addendum before any trained-arm output is examined.  No
      post-result replenishment, substitution or re-splitting is allowed.
    denominators: >-
      Report the actual distinct-problem counts and scored-token sums for every
      compared arm and exit; a missing or mismatched denominator makes that
      comparison unevaluable rather than silently dropping the row.
  bootstrap:
    iters: 10000
    seed: 0
    unit: problem cluster
    confirmatory_seed: 0
    extra_seed_role: >-
      Robustness only; extra seeds never replace the seed-0 verdict.
    single_seed: paired problem-cluster bootstrap
    multi_seed: crossed pigeonhole bootstrap over problems x seed pairs
    sensitivity: >-
      Per-seed-pair table plus a mixed-effects logistic sensitivity check; three
      seeds would still make the seed component coarse.
  fixed_sequence_rule: >-
    E_2 is tested first; E_{k+1} receives alpha only after E_k is rejected.
    Each requires the registered lower bound > 0 (one-sided alpha 0.02, i.e. a
    96% CI, unless D1 is rejected, when the E-sequence alpha is 0.025 and the
    CI is 95%).  A failure stops the forward propagation but does not discard
    alpha that the graph can recycle to a later hypothesis; final decisions are
    taken after the graphical algorithm terminates.  E1 is a precondition with
    no alpha; D1 is a separate IUT in the graphical family.
  holm: >-
    N=2 (full LCB) and N=3 (182 post-cut items) versus O-H are exploratory and
    Holm-corrected as one family on LCB at one-sided 0.025 with paired
    problem-cluster bootstrap p-values, outside the confirmatory FWER;
    monotonicity in N is never assumed.  N=4 is the confirmatory primary, so it
    is not in the Holm family.
  single_seed_statement: >-
    The confirmatory verdict is computed once, on seed 0.  Seeds 1 and 2 are
    robustness-only and never replace it; item-level intervals do not include
    training-seed variance.
  google_comparison: reproduction check
  secondary:
    - NLL on three corpora (teacher traces, O's verified traces, answer segment)
    - GPQA
    - MMLU-Pro
    - MMMU-Pro Standard(10) and Vision
    - MATH-Vision
    - generated lengths
    - truncation rate
    - FLOPs per problem (D3; secondary to the per-byte metric)
    - difference-in-differences across stages, using the post-Stage-1 LCB runs
    - intelligence per resident byte (D6 / intelligence_per_byte)
  o_only:
    - AIME 2026
    - SpatialEval VQA
    - SpatialEval TQA
    - CV-Bench 2D
  priority_order:
    - "E2/E3: O, O-H and L(N=4) on the full LCB 1,055 x 1 (L(N=2) on the same items is the D2 paired baseline)"
    - "D1/D4/D5: multi-exit NLL sweep N=1..16 on buckets 60-69 (L-heal and L-final)"
    - "E4: re-score saved completions at B = 1k..32k"
    - "D2: L(N=4) - L(N=2) on the full LCB 1,055 x 1"
    - "D6: byte frontier (resident bytes, phi, m, bytes read per token, latency <= 0.5 GPU-h)"
    - "R and R-damped on the 182 post-cut items x 1"
    - "Secondary: GPQA, MMLU-Pro, vision (at N=4 for L, the primary level)"
    - "O-only: AIME and spatial"
  priority_note: >-
    This order is also the drop order if the padded engine is registered: if
    compute runs short, drop items from the bottom while preserving E2/E3, E4,
    D1-D2 and the D6 denominator.

# ---------------------------------------------------------------------------
# Intelligence per resident byte (estimation only; the author's objective)
# ---------------------------------------------------------------------------

resident_bytes:
  role: estimation only
  denominator: >-
    R counts every tensor that must be resident, on GPU or CPU, to produce the
    scored output, at the dtype as loaded in the evaluation process.
  unit: GiB
  components:
    - "text decoder prelude 0..s-1, block s..e and coda e+1..34 weights (including layer scalars and final norm); bf16 expected: 25-29 = 2.446 / 0.659 / 0.659 GB, 16-18 = 1.257 / 0.387 / 2.120 GB, 15-29 = 1.128 / 1.977 / 0.659 GB"
    - "embedding / LM head (tied; counted once, 0.805 GB bf16)"
    - "PLE table embed_tokens_per_layer (CPU-resident by default, 4.698 GB bf16)"
    - "per-layer projection and per-layer projection norm (0.028 GB bf16)"
    - "LoRA A/B: unmerged for L because pass 1 must stay adapter-free; O-H is primary merged (0 bytes) and unmerged is a sensitivity"
    - "bridge g (1,536 bf16 = 3 KB)"
    - "loop_ple if present (absent in the registered shared mode)"
  excluded: >-
    KV cache, activations and the CUDA context are excluded; KV is reported
    separately as bytes at 8k and 32k context.  Loops add zero KV.
  vision_audio: >-
    Vision is counted only for vision benchmarks, audio never.  The primary
    text metric excludes the vision tower and reports it as a sensitivity.
  dtypes: >-
    bf16 only for E2B, O, O-H and L; every registered byte count is at the
    evaluated precision.  The q4_0 cross-precision sensitivity is dropped from
    Part 1 (the 4-bit frontier is Part 2).  E4B is only an annotation under its
    QAT q4_0 (a separate model, not a point on the bf16 bytes axis); Part 1
    makes no cross-precision per-byte claim.
  hosts: >-
    GPU-resident and CPU-resident bytes are reported separately and summed;
    R_GPU (PLE excluded) and R_ckpt (whole multimodal checkpoint) are
    sensitivities.  Units are GiB throughout (1 GiB = 2^30 bytes).
  merged: >-
    L cannot be merged without breaking pass 1 = O: a merged L needs both W and
    W+BA resident, R + W_block (+0.614 GiB for 25-29, +0.360 for 16-18, +1.841
    for 15-29).  L unmerged is the byte-minimal deployable form; "L merged" is a
    sensitivity only.  O-H merged = R(O) with the LoRA at 0 bytes (primary);
    O-H unmerged is a sensitivity.
  formula: >-
    R = sum over modules of numel x dtype_bytes, measured from the loaded state
    dict plus the CPU-side PLE table, and written to run.json; reported in GiB.
  expected_bf16:
    O_E2B_and_L_N1: "8.657 GiB (GPU-side 4.282 GiB + PLE 4.375 GiB)"
    L_25_29: "+7.9 MB LoRA, +0.614 GiB if merged"
    L_16_18: "+4.7 MB LoRA, +0.360 GiB if merged"
    L_15_29: "+23.7 MB LoRA, +1.841 GiB if merged"
    E4B: "14.003 GiB text-resident (GPU-side text 8.753 GiB + CPU PLE 5.250 GiB; 7,518,069,034 text params), computed from the pinned 4ecc2ba safetensors header with huggingface_hub.get_safetensors_metadata; the whole checkpoint is 14.894 GiB, of which vision and audio are excluded from the text denominator"
  lo_ratio: >-
    E4B/E2B = 1.62 (R), 2.04 (R_GPU), 1.56 (R_ckpt).  Both sides are computed
    from the pinned safetensors headers (E2B 4adf157, E4B 4ecc2ba) via
    huggingface_hub.get_safetensors_metadata: R_E4B = 14.003 GiB,
    R_E2B = 8.657 GiB; rho = 1.62 is frozen before the tag.
  invariants: >-
    B(L, N=k) = B(L, N=1) for k = 2..8 (shared adapters, KV separate);
    B(L, N=1) = B(O) + B(LoRA) + B(g);
    O-H merged = R(O), and the 0.3 % L-versus-O-H difference is the bf16 LoRA.

intelligence_per_byte:
  role: "estimation only; never gates E1-E4"
  denominator: "resident_bytes"
  quality:
    primary: >-
      LCB release_v6 1,055 x 1 pass@1 (pp) with a problem-cluster bootstrap CI
      (10,000); the 182 post-cut subgroup is descriptive.
    secondary: >-
      Calibrated NLL (nats/token) on bucket 62-69 with one temperature per
      (arm, checkpoint, N) fitted on bucket 60-61, on O's verified-correct
      traces.
    never_merged: >-
      Pass@1 and cNLL stay on two axes and are never divided into one number.
  derived:
    scalar: >-
      pp_per_GiB = pass@1(pp) / R(GiB); the numerator is resampled by problem,
      the denominator is exact, with a problem-cluster bootstrap CI.  It is
      shown only next to both components and with the note that R is dominated
      by the fixed PLE table, so the scalar is a model-level description (for
      example L-E2B), not a within-L comparison over N.  E4B is an annotation:
      its bf16 text-resident denominator is computed from the pinned header
      (14.003 GiB), but Google's QAT q4_0 score is not a point on the bf16
      bytes axis.
    within_loop: "delta pass@1 and delta cNLL at delta R = 0 (LoRA <= 0.3 %)"
    forbidden: >-
      No nats/GiB: a signed numerator over bytes has no interpretation.
  fixed_bytes_effects:
    delta_loop: >-
      delta_loop(N) = L(N) - O-H at N = 1, 2, 4 (N = 3 where run) on LCB full,
      plus GPQA and MMLU-Pro only where registered: at N=1 for O and at N=4 for
      L.  There is no GPQA or MMLU-Pro run at N=2, so no N=2 secondary-bench
      effect is reported.
    delta_total: "delta_tot(N) = L(N) - O at the same registered points."
    primary_claim: >-
      The main presentation is the pair of fixed-byte paired effects
      (delta_tot(N=4), delta_loop(N=4)) in percentage points plus delta cNLL in
      nats/token, at delta R ~ 0.  There is no per-GiB division of the
      differences: the absolute pp_per_GiB scalar is reported separately as a
      model-level description.  Google's gap fractions phi and the
      byte-equivalent multiplier m are illustrative only, shown beside the
      fixed-byte effects and never as a headline proof of intelligence density
      or a larger-model-equivalence claim.
  anchoring:
    phi_loop: >-
      phi_loop(N) = delta_loop(N) / G, the loop-attributable share of Google's
      E4B - E2B gap.  Illustrative only, never a headline: G = LCB 8.0,
      GPQA 15.2, MMLU-Pro 9.4 pp; the CI comes from our bootstrap only and G is
      a constant labelled "reproduction-check level".  Interpreting phi as a
      share of a transferable capability gap assumes comparable
      benchmarks/protocols and treats uncertain published scores as constants,
      so phi is not assumption-free.
    phi_tot: >-
      phi_tot(N) = delta_tot(N) / G, which also includes the training effect
      that O-H receives at the same bytes.  Reported with its own m and
      illustrative only.
    byte_multiplier: >-
      m_loop = rho^phi_loop and m_tot = rho^phi_tot, with rho = R_E4B / R_E2B
      (1.62 primary, computed from the pinned headers; 2.04 and 1.56
      sensitivities).  Illustrative only, not measured byte equivalence or a
      frontier against E4B: it adds a scaling-law assumption from two model
      sizes.  The fixed-byte paired effects, not m, carry the Part 1
      intelligence-per-byte result.
    illustrative_only: >-
      Google's gap fractions phi and the byte-equivalent multiplier m are
      demoted to illustrations: they appear beside resident bytes, quality and
      runtime, never as a headline.  The fixed-byte paired effects carry the
      Part 1 result.  Part 1 establishes no local larger-model frontier and
      makes no cross-precision per-byte claim.
    google_role: >-
      Reproduction check only; Google's same-protocol numbers are never a point
      on the bytes axis and appear only as a labelled annotation.
  secondary:
    bytes_read_per_token: >-
      B_read(N, c) = W_base + (N-1) * (W_block + W_LoRA) + KV_base(c)
      + (N-1) * KV_block(c), with W_base = 4.282 GiB (every text-path weight
      read once per token plus 35 x 256 PLE rows), W_block = 0.614 / 0.360 /
      1.841 GiB (25-29 / 16-18 / 15-29), and KV_block(c) summed over the
      block's full and sliding consumer layers: n_full * 2 KiB * c + n_slide *
      1 KiB * min(c, 512), with (n_full, n_slide) = (1, 4) / (0, 3) / (3, 12).
      Register r_bytes(N, c) for N = 1..8, 12 and 16 and c in {1k, 8k, 32k};
      E4B reads ~2.05x E2B's N=1 bytes.  Parity points where L reads as many
      bytes as E4B: N ~ 8 (25-29), N ~ 13 (16-18), N ~ 3.4 (15-29).
    latency: >-
      Batch-1 decode ms/token on the RTX 5070 for O and L at N = 1, 2, 4, 8 at
      c = 1k, 8k and 32k.  It runs before the tag on the padded engine for all
      three blocks and is re-run if refill is registered; descriptive only.
      The micro-benchmark costs <= 0.5 GPU-h and runs under gpu.lock.
    kv_bytes: >-
      Reported separately at 8k and 32k; never in the denominator; loops add
      zero KV.
    flops: >-
      D3 remains a secondary FLOPs frontier, never the intelligence-per-byte
      metric; useful analytic FLOPs including exit-check costs are registered,
      and executed FLOPs and wall clock are reported alongside.
  reference_points:
    - "O-E2B N=1 (LCB full; GPQA and MMLU-Pro at N=1)"
    - "O-H N=1 after Stage 1 and after Stage 2 (LCB full)"
    - "L-heal at N=2, 3 and 4 on the ladder items (182 post-cut + GPQA 198)"
    - "L-final at N=2 (LCB full, the D2 baseline), N=3 (182 post-cut) and N=4 (LCB full, the primary run)"
    - "the D4 winner's mean-N policy on the same registered completions"
    - "E4B only as a labelled annotation: no local bf16 accuracy run in Part 1 (~8.8 GiB weights + ~1.9 GiB KV at 32k exceeds the 10.28 GiB cap); q4_0 is a different model"
  table: >-
    Per benchmark: arm, N, R / R_GPU / R_ckpt in GiB, accuracy, delta_loop,
    delta_tot, phi_loop, phi_tot, m_loop, m_tot, r_bytes(N,8k), ms/token, KV
    bytes at 8k and 32k.
  charts:
    - "Accuracy against R on a log x-axis, O/O-H/L(N) stacked at E2B's bytes; Google's E2B and E4B points are a labelled annotation, never a point on the bytes axis"
    - "Accuracy against bytes read per token, with E4B at its 2.05x as a labelled annotation"
  limitations: >-
    Part 1 makes no cross-precision per-byte claim: every byte count is at the
    evaluated precision (bf16).  An nf4 E4B fits in fewer resident bytes than a
    bf16 E2B, so "L closes the E4B gap per byte" is valid only at matched
    precision.  The matched-precision 4-bit frontier (O-E2B and L-E2B with 4-bit
    block weights and bf16 LoRA versus E4B 4-bit at matched resident bytes,
    including whether the dial survives quantization because the block's
    quantization error is re-applied on every pass) is Part 2.  There is no
    local E4B accuracy run in Part 1.
  d6:
    id: D6
    name: "byte frontier"
    status: "estimation only, no gate"
    test: >-
      Estimation endpoints on the resident-byte axis: itemised resident bytes
      at bf16 (merged and unmerged, GPU and CPU, KV separate); delta accuracy
      and delta cNLL at fixed bytes; phi, the share of Google's E2B->E4B gap
      closed, with Google's same-protocol numbers as a reproduction check; the
      byte-equivalent multiplier m; analytic bytes read per token; and a
      measured batch-1 latency micro-benchmark (<= 0.5 GPU-h).  Never a gate.
    priority: "after E4"
    cost_gpu_hours: "<= 0.5 (latency micro-benchmark), run with T-dial-bench under gpu.lock"

# ---------------------------------------------------------------------------
# Pilot (runs only after the tag; held-out metrics only; never benchmarks)
# ---------------------------------------------------------------------------

pilot:
  runs_after_tag: true
  held_out_only: true
  benchmarks: false
  cost_gpu_hours: "43-52 local GPU-hours (round-7 estimate: rounds-5/6 matrix plus the ninth arm and the two added O-H arms, +1.8 h)"
  # Round 8: the plain-language "why" report is descriptive only and never an
  # input to selection, eligibility, STOP or any confirmatory endpoint.
  why_report: >-
    The pilot harness writes a plain-language "why" report for the teacher and
    architecture comparison: which teacher/recipe won and the REASONS, not only
    the ranking.  It is descriptive diagnostics only and never enters
    selection.
  why_role: "descriptive diagnostics; never selection inputs"
  # Round 8e: the frozen Docker verifier defines pilot code eligibility.
  code_verification:
    domain: >-
      The pilot's verified domain is math plus code passing the frozen Docker
      verifier.  Chat never counts as a verified target.  Math keeps the
      registered math-verify/normaliser OR rule and timeouts.
    chat_rule: >-
      Chat is never a verified target and never counts toward a P1, T-fit or
      selection corpus, a shortfall count, an extension trigger or any P2
      threshold.
    test_set: >-
      The existing source tests stored for each problem in the frozen Stage 0
      pool, with a manifest of the exact ordered test bytes and their problem
      associations.  No newly generated DeepSeek tests, changed expected
      answers, selectively removed tests or sample-specific test subsets are
      added under this amendment.
    test_manifest: >-
      An ordered per-problem test manifest with SHA-256s of every test and
      reference artifact actually used, test counts, the extraction/wrapper/
      comparison code, the Docker image content digest and the Python/
      dependency lock.  Invalid or no-test exclusions and any frozen
      reference-test validation are recorded.  A mutable python:3.12-slim tag
      alone is not sufficient.
    extraction: "src/gemmaloop/stage0/postprocess.py extract_code (frozen bytes)"
    wrapper: >-
      The registered functional/stdin wrapper bytes are frozen and hashed with
      the extraction and comparison implementation.
    output_comparison: >-
      The registered output-comparison implementation and its exact bytes are
      frozen; no sample-specific comparison variant may be substituted.
    grading_implementation: >-
      src/gemmaloop/stage0/grader.py GraderService (registered); sandboxed=true
      is required for a pass.
    dependency_versions: >-
      The pinned grader's Python version and dependency lock are frozen with
      the verifier; the running count must match these exact artifacts.
    docker_image: "python:3.12-slim pinned by content digest"
    docker_image_digest: >-
      python:3.12-slim@sha256:4840d514c583a4d3d8cad3940e68dee6f0f6f3635c12fcd0a3d74c21a5b93a54
      (the preview count's image); the final count must bind the same frozen
      digest, and a mutable tag alone is insufficient.
    sandbox_limits: >-
      CPU-only Docker, network none, read-only root and candidate mount, a
      64 MiB /tmp tmpfs, 512 MiB memory and memory-swap limits, 64 PIDs, 1 CPU,
      user 65534:65534 and no-new-privileges.
    timeout_rule: >-
      The registered timeout is 6 seconds per test using the pinned grader's
      timeout implementation.
    pass_rule: >-
      A code completion is verified only if the nonempty full frozen test set
      passes, with sandboxed=true.
    fail_rule: >-
      Empty/invalid/missing tests, unsupported execution, candidate timeout or
      failure, and grader failure do not count as a pass.
    infrastructure_rule: >-
      Infrastructure errors are recorded separately from wrong answers.  They
      may be resolved only by rerunning the identical input bytes under the
      identical frozen configuration, never by changing limits or selecting a
      favorable rerun.  No unsandboxed fallback is allowed.
    unsandboxed_fallback: >-
      None.  The unsandboxed local mode is never used for model-generated code,
      and no sample is silently relabelled verified.
    current_count_rule: >-
      SUPERSEDED HISTORY, not operative after round 8f: the preview count is
      not a decision input.  The operative rule is that the v3 verifier must be
      frozen and fully recounted before pilot scoring and before the data
      addendum and seal; the official count is the completed v3 recount from
      the same frozen original samples with the frozen v3 verifier.  If any
      artifact/configuration does not match the v3 freeze, recompute all
      affected code grades.
    freeze_index: "prereg/pilot-shortfall-freeze.json"
  shortfall:
    rule: >-
      PILOT SHORTFALL AMENDMENT adopted before prereg-v1 and before any pilot
      scoring or trained-arm training, informed by realized original-model
      sampling and verification counts; no trained-arm outcome or pilot ranking
      is used.
    domain: >-
      The pilot's verified domain is math plus code passing the frozen Docker
      verifier; chat never counts.  Only the original selected problem IDs are
      used: P1's selected 50 problems, the 86 originally sampled T-fit
      problems and the 150 originally sampled selection problems, with their
      original split membership.
    p1_descriptive_only: >-
      P1 is descriptive for every count and never gates P2.  With fewer than 20
      verified P1 problems its estimates are labelled small-sample descriptive;
      with zero, P1 is unevaluable.  No P1 metric or diagnostic affects the
      extension, teacher choice, arm matrix, architecture selection, stopping
      or any confirmatory claim.
    p1_gates_p2: false
    p2_domain: >-
      P2's domain is math plus code passing the frozen Docker verifier; chat
      never counts as a verified target.  Confirmatory D1 remains math-only
      under its separate contract.
    chat_never: >-
      Chat never counts toward any pilot corpus, shortfall count, extension
      trigger or P2 minimum.
    extension_trigger: >-
      Complete code grading and per-request accounting for the original
      attempts first.  Let nT0 and nS0 be the resulting distinct verified
      math-plus-code counts in T-fit and selection.  If nT0>=20 AND nS0>=30,
      use only the original attempts and make no extension.  Otherwise
      generate exactly four additional original-model attempts, indices
      4,5,6,7, for every math/code problem in each original T-fit and
      selection input set, irrespective of previous success and irrespective of
      which split is deficient.
    attempt_indices: [4, 5, 6, 7]
    request_id_rule: >-
      For problem_id p and index j the request_id is p+":"+str(j).
    seed_formula: >-
      seed = int.from_bytes(sha256(UTF8("0:"+request_id)).digest()[:8],
      "little", signed=False) modulo (2**63-1), as in the corrected
      lite_request_seed implementation.  Every actual seed and request is
      recorded.
    request_count_rule: >-
      The additional request count is exactly four times the number of
      math/code problems in the union of the two original input sets.  Generate
      no extra P1 attempts and no chat attempts.
    configuration: >-
      Extra attempts use the same original-model revision, tokenizer/chat
      template, Modal/vLLM backend/version, numerical precision, pinned
      sampling image and sampling parameters as the completed lite run:
      temperature 1.0, top_p 0.95, top_k 64, thinking enabled and per-request
      max_new_tokens = 8192 - rendered_prompt_tokens, with the same
      rendered-length eligibility rule.
    artifact_rule: >-
      Keep the original run immutable and write the extension to a separately
      identified, parent-linked artifact directory/run manifest.  Commit the
      full conditional request/seed/configuration plan before generating any of
      its completions.
    immutable_original: >-
      The original run and its committed completions are immutable; a new
      completion is never substituted for an original success.
    resume_rule: >-
      A technical resume may complete missing request IDs with the identical
      plan; never regenerate an already committed completion to choose a
      different one.
    early_stop_rule: >-
      Do not stop early on reaching a verified-count threshold, add replacement
      problems, or launch another count-triggered batch.
    max_extension_batches: 1
    final_min_tfit_problems: 20
    final_min_selection_problems: 30
    final_shortfall_rule: >-
      If the extension branch is taken, finish and verify all planned requests,
      then form each P2 corpus from the union of eligible original and
      additional traces.  P2 can run only if final T-fit>=20 AND final
      selection>=30 distinct verified problems and all other registered
      prerequisites hold.  If either minimum remains unmet, the pilot is
      unevaluable for insufficient corpus and P2 does not run under this
      registration; report the counts and reason.  This is not evidence for a
      mechanism null.
    no_relaxation_rule: >-
      There is no automatic second batch, minimum reduction, filter relaxation,
      domain substitution, bucket borrowing or default teacher/architecture.
      Any further proposed design change requires a separately disclosed
      version before affected results and preserves the original registration
      and failed adequacy result.
    rejected_alternatives: >-
      D is rejected: do not set the P2 minimums to the observed 16 and 23 or
      select an intermediate reduction after seeing the code counts.  E is
      rejected here: do not admit reasoning_share<0.75 traces, manufacture
      missing answers or score only an available prefix as a verified target.
      Neither filter is relaxed.
    unused_bucket_rule: >-
      Use only the original selected problem IDs and their original split
      membership.  Do not expand to the unused bucket members or to nominal
      target sizes.  Freeze their complete problem/request ID lists before
      applying this amendment.
