  - >-
    Bench roles are explicit in the schema: confirmatory, secondary, o_only and
    harness; there is no default to confirmatory.
  - >-
    The O-H-RLext trigger is "E2 passes", seed 0 only, 1.5x Stage 2 steps on
    fresh prompts; it is not confirmatory.
  - >-
    Part 1 is E2B; seeds [1, 2] are registered as robustness-only, in that
    order; E4B is deferred.
  - >-
    The Google comparison is a "reproduction check" on O's full 1,055-item LCB
    run; the separate 182-item generation is dropped (lcb_google is a virtual
    view of the same run).
  - >-
    Creative evaluation is Part 2/exploratory; S3 is not a Part 1 confirmatory
    endpoint.
  - >-
    The graphical alpha procedure (Bretz et al. 2009) replaces the uniform
    95 % sequence: E2 0.02 and D1 0.005 initially, D1 -> E2 recycled at 0.025,
    E2 -> E3 -> E4 fixed sequence, E4 -> D1 recycled at 0.025.
  - >-
