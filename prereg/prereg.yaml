mde_notes: >-
  Recomputed with gemmaloop.eval.stats.mde at alpha=0.05 two-sided (power 0.80,
  omega2=1/12, sigma2=1/6) except the E2 row at one-sided 0.02.  N does not
  enter the MDE (n and k do), so moving the primary from N=2 to N=4 leaves the
  item-level MDE unchanged.  D2's paired accuracy SE is an estimate, not an MDE:
  sqrt((0.15-0.20) / 1055) = 1.2-1.4 pp; the -3 pp non-inferiority margin is
  reported but not gated.

# ---------------------------------------------------------------------------
# Choices made by the drafter (revision round 5)
# ---------------------------------------------------------------------------

drafter_choices:
  - >-
    Horizon loop_probs = [0, 0, 0, 0.70, 0.075, 0.075, 0.075, 0.075]: T=4 at
    70 %, T in {5,6,7,8} at 7.5 % each; N=1 batches are not trained because
    adapters are N>=2-only.  N=2..8 are trained, dense on 2-4.
  - >-
    Stage 1 beta = 0.1 with KL(parent || student) at every exit; parent logits
    are computed live, full-vocab, with adapters off at N=1.
  - >-
    Stage 1 top-k = 64 in float16 plus one tail bucket (teacher mass outside
    the top-k versus the student's) so the KL is a proper divergence.
  - >-
    Stage 1 budget is fixed at 12M tokens; the loss is logged every 2M tokens
    descriptively, with no dose-response decision.
  - >-
    LoRA rank 16, alpha 32, LoRA LR 2e-4; bridge LR 3e-3; loop_ple LR 1e-3;
    legacy scalar w0 = 0.99.  Optimizer: bitsandbytes 8-bit AdamW (adamw_8bit)
    on GPU for every arm and stage that trains (the yaml field keeps the legacy
    "AdamW" spelling; run.json records the resolved optimizer), per-device
    batch 1 row x gradient
    accumulation 16 rows per optimizer step (rows_per_optimizer_step = 16;
    the measured tokens per step are recorded in run.json), gradient clip
    1.0, token-cosine with 3 % warmup; LoRA targets the loop block only; one
    LoRA and one g shared by every pass >= 2.  Under --prereg every one of
    these values is read from prereg.yaml and a CLI override exits 2 (round
    7c recipe binding).
  - >-
    Stage 2 uses G=8, 16 prompts/step, 100 steps, a 2,048-token prompt cap
    (prompts above it are excluded from the pool at selection time, identically
    for both arms), an 8192 completion cap (row <= 10,240 tokens), the same
    bitsandbytes 8-bit AdamW (adamw_8bit) on GPU, LoRA LR 2e-5,
    bridge LR 1e-3, beta_KL=0.0, TIS cap 2.0, num_iterations=1, Dr. GRPO
    normaliser 8192, per-test timeout 6 s; the N mix is the structured
    rollout_n_groups {2:3, 3:3, 4:8, 6:1, 8:1} over N=2/3/4/6/8 (validated to
    sum to 16).
  - >-
    E2/E3/E4 primary uses N=4 on the full release_v6 (1,055 items x 1 sample);
    the post-cut subgroup is reported separately and L(N=2) runs the same 1,055
    items as the D2 paired baseline.
  - >-
    E1 is a precondition with no alpha: bit-exact L(N=1) on every engine plus
    descriptive heal estimates.  The fixed sequence is E2 -> E3 -> E4.
  - >-
    The confirmatory verdict is computed once, on seed 0, with a
    problem-cluster bootstrap; seeds [1, 2] are robustness only and the crossed
    bootstrap is a robustness check.
  - >-
    E4 uses the code r_4 = 2.2824/1.4275/1.2515 for 15-29/25-29/16-18 on
    O-H's grid: O-H at B = 1024 * 2^j (j=0..5), L at floor(B/r_4), both from
    saved completions and both <= 32,768, trapezoid AUC over j / 5.
  - >-
    Pilot P2 uses the 11-arm matrix above (nine selection/control arms plus two
    descriptive single-exit anytime-tax arms, N 2/3 and N=4), scores on O's
    verified-correct traces, and applies one deterministic two-step rule:
    teacher first by mean gain over O of (25-29+gch+T) and (O-H+T), then
    block/bridge by rule B.  E = the frozen 84c5da0 eligibility is the
    STOP/eligible set; arms in E are ranked by
    Delta_bar_arm = mean_{N=2..4}[cNLL(O-H[block]) - cNLL(L,N)] (same teacher; matched
    rank-16 LoRA capacity per block, round 8c; L's bridge/package itemized separately); the adjacent-regression check (<= 0.005 for N=1,2,3
    and cNLL(8) <= cNLL(1), point estimates) is a filter that selects the
    filtered argmax if any arm passes, else the unfiltered argmax over E.
  - >-
    Pilot P3 uses 200 held-out math problems x 4 samples from the named pilot
    P3 bucket, a 4k cap on prompts with O median <= 2.5k, paired SE >= 2,
    truncation < 10 %; P3 RL prompts are drawn from the Stage 0 train bucket
    0-49; the RFT fallback recipe is registered above.
  - >-
    One split table assigns problems by sha256(problem_id) % 100 into disjoint
    train / pilot-dev / NLL-KL / long-trace / held-out buckets; the pilot bucket
    50-59 is sub-allocated into disjoint P3 (50-53), selection (54-56), T-fit
    (57-58) and P1 (59) sub-ranges.
  - >-
    The NLL/KL bucket 60-69 is sub-allocated: 60-61 (100 problems) fits one
    temperature per (arm, checkpoint, N) and the D4 thresholds for every post-training NLL
    endpoint; 62-69 (400 problems) is the scored NLL test corpus.
  - >-
    Stage 0 pool: 2,000 code, 2,000 math and 1,000 chat prompts, 4 samples each,
    about 64M tokens.  Chat source is the existing decontaminated chat source;
    "synthetic" code is dropped; if fewer than 1,600 prompts qualify, cycle the
    qualifying set in the same order.
  - >-
    Data decontamination is 13-gram plus Indel >= 0.75 against every registered
    eval and the creative briefs; the manifest SHA is frozen in the addendum.
  - >-
    Stage-0 samples are kept only if finish_reason=stop, the thought channel is
    closed, the answer is non-empty and length <= 8192; the reasoning share of
    code + math tokens is >= 75 %.
  - >-
    Compute tiers are local, single cloud GPU, multi-GPU and TPU, chosen by
    availability only and recorded as a covariate.  Stage 0 is Modal stock vLLM
    v0.30.0 data-only ($30 usage cap / $0 spend limit), with a local HF-engine
    fallback and the engine recorded per row.  Stage 2 rollouts and all
    evaluation use the padded adaptive-batch HF engine for O, O-H and L (round
    8c: the refill track is closed and the earlier conditional wording is
    historical).
  - >-
    R and R-damped are diagnostic only, scored on the 182 post-cut items x 1;
    R-damped uses the Euler damped_update with weights 1/N (0.5/0.333/0.25 at
