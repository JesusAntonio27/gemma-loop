    acceptance rule.  After attempt 4 the one bounded repair developed gate v6
    on branch fix/gate-v6 (commits 9caad55, a46a691, e4d5eab, 78d93fa, 8f36aca;
    branch head 8f36acad8abda3dd099e3589539844587c9f93cc); native review rejected it (C1-C3: greedy device
