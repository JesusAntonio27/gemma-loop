  items:
    R8E-01:
      id: R8E-01
      title: "Pilot verified domain is math plus frozen-verifier code; chat never"
      changes: >-
        Adopted A: the pilot's verified domain is math plus code passing the
        frozen Docker verifier; chat never counts as a verified target.  Use
        only the original selected problem IDs (P1's selected 50, the 86
        originally sampled T-fit problems and the 150 originally sampled
        selection problems) with their original split membership.  Do not
        expand to unused bucket members or nominal target sizes.  Math keeps
        the registered math-verify/normaliser OR rule and timeouts; the Stage 0
        filter remains finish_reason=stop, closed thought channel, nonempty
        answer, rendered prompt-plus-completion length <=8192 and
        reasoning_share>=0.75 for math/code.  All conditions and a passing
        verifier are required for a verified trace.  Confirmatory D1 remains
        math-only under its separate contract.
      where:
        - "prereg.yaml pilot.code_verification.domain, chat_rule"
        - "prereg.yaml pilot.shortfall.domain, p2_domain, chat_never, unused_bucket_rule"
        - "prereg.yaml pilot.p1.domain_rule"
        - "prereg.yaml pilot.p2.domain_and_freeze"
        - "prereg.yaml claims"
        - "PREREGISTRATION.md sections 3.3, 5, 6.2b, 6.3 and the round-8e amendment"
      why: >-
        The panel adopted verified math+code prospectively before any pilot
        score or trained-arm result; the old math-only clause was a round-8c/8d
        historical choice, not a reason to discard eligible verified code.
      uses_outcome: false
      outcome_basis: >-
        No trained-arm outcome: a domain/eligibility amendment fixed by the
        panel before the realized code counts were used.
    R8E-02:
      id: R8E-02
      title: "Frozen Docker verifier and test-set specification"
      changes: >-
        Registered the code-verifier freeze: the existing source tests stored
        for each problem in the frozen Stage 0 pool with an ordered per-problem
        test manifest and SHA-256s; no newly generated tests, changed expected
        answers, selectively removed tests or sample-specific subsets.  Froze
        the extraction, functional/stdin wrapper, output comparison, grading
        implementation and dependency versions.  The Docker image is pinned by
        content digest (python:3.12-slim@sha256:4840d514c583a4d3d8cad3940e68dee6f0f6f3635c12fcd0a3d74c21a5b93a54),
        with CPU-only Docker, network none, read-only root and candidate mount,
        64 MiB /tmp tmpfs, 512 MiB memory/memory-swap, 64 PIDs, 1 CPU, user
        65534:65534, no-new-privileges and the pinned 6-second per-test
        timeout.  A pass requires the nonempty full frozen set with
        sandboxed=true; invalid/no-test/unsupported/timeout/failure and grader
        failure do not pass, infrastructure errors are recorded separately and
        rerun only on identical input bytes and configuration, and no
        unsandboxed fallback is allowed.
      where:
        - "prereg.yaml pilot.code_verification.*"
        - "prereg.yaml grading.code_rule, unsandboxed_rule, dependency"
        - "pins.task_modallite_commit (verified run provenance)"
        - "PREREGISTRATION.md section 5 and the round-8e amendment"
        - "prereg/pilot-shortfall-freeze.json (verifier freeze contents)"
      why: >-
        Code eligibility is only meaningful when the tests, wrapper, grader,
        dependencies, image digest and limits are frozen before the official
        count; a mutable image tag or sample-specific test selection would make
        the count unauditable.
      uses_outcome: false
      outcome_basis: >-
        No trained-arm outcome: a verifier/test freeze and execution contract
        based on the existing implementation.
    R8E-03:
      id: R8E-03
      title: "P1 is descriptive-only and never gates P2"
      changes: >-
        Adopted C unconditionally: P1 is descriptive for every count and does
        not gate P2.  With fewer than 20 verified P1 problems its estimates are
        labelled small-sample descriptive; with zero, P1 is unevaluable.  No P1
        metric or diagnostic affects the extension, teacher choice, arm matrix,
        architecture selection, stopping or any confirmatory claim.  The
        historical 50x4=200 describes original P1 attempts and never means 200
        verified rows.
      where:
        - "prereg.yaml pilot.p1.role, gates_p2, continuation_gate, small_sample_threshold, zero_count_rule, shortfall_rule, description"
        - "prereg.yaml data.splits.shortfall_rules"
        - "PREREGISTRATION.md section 3.3 and the round-8e amendment"
      why: >-
        A separate diagnostic sample must not create an unnecessary dependence
        of P2 on P1; removing the continuation gate before any P1 output is
        opened is defensible and does not weaken the P2 20/30 conditions.
      uses_outcome: false
      outcome_basis: >-
        No trained-arm outcome: a pilot-continuation-gate amendment fixed
        before any P1 output was used.
    R8E-04:
      id: R8E-04
      title: "Conditional four-attempt extension with fixed indices and seeds"
      changes: >-
        Adopted B only at the count trigger: after complete original
        per-request accounting, if nT0>=20 AND nS0>=30 use only the original
        attempts; otherwise generate exactly four additional original-model
        attempts, indices 4,5,6,7, for every math/code problem in each original
        T-fit and selection input set, irrespective of previous success and
        irrespective of which split is deficient.  Generate no extra P1 or chat
        attempts.  The additional request count is exactly four times the
        math/code problems in the union of the two input sets.  For problem_id p
        and index j the request_id is p+":"+str(j); seed is
        int.from_bytes(sha256(UTF8("0:"+request_id)).digest()[:8], "little",
        signed=False) modulo (2**63-1).  Commit the full conditional
        request/seed/configuration plan before generating any completion, keep
        the original run immutable, write a separately identified parent-linked
        artifact, allow only identical-plan technical resume, and never stop
        early, replace problems or launch another count-triggered batch.
      where:
        - "prereg.yaml pilot.shortfall.extension_trigger, attempt_indices, request_id_rule, seed_formula, request_count_rule, configuration, artifact_rule, immutable_original, resume_rule, early_stop_rule, max_extension_batches"
        - "prereg.yaml pilot.p2.shortfall_rule"
        - "PREREGISTRATION.md section 3.3 and the round-8e amendment"
      why: >-
        This is the single bounded extension the panel authorized: a doubling
        from four to eight attempts per original P2 math/code problem, not a
        power guarantee and not a selective top-up.
      uses_outcome: false
      outcome_basis: >-
        No trained-arm outcome: a conditional sampling plan fixed before any
        extension completion exists.
    R8E-05:
