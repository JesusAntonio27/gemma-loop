    - R8D-02
    - R8D-03
    - R8D-04
    - R8D-05
  items:
    R8D-01:
      id: R8D-01
      title: "Probe schedule and generation-sanity rule aligned with the code"
      changes: >-
        Replaced the two monitor deferrals with the implementation's exact
        rules.  Interval probes fire at the first optimizer-step boundary where
        tokens_seen - last_probe_tokens >= 500,000, with last_probe_tokens
        advancing after every probe; a train-end probe fires when tokens_seen >
        last_probe_tokens.  At the registered 3M-token pilot dose and the
        ~26k-token optimizer step the achieved probes are 0.52M, 1.04M, 1.56M,
        2.08M and 2.60M tokens (the 20th, 40th, 60th, 80th and 100th step),
        plus a train-end probe at ~3.00M tokens.  For N <= 4 the
        generation-sanity rule WARNs on repetition loops, or on a missing
        answer or an open thinking channel only when the generation stopped
        before the 512-token completion cap (finish_reason != "length"); a
        length-truncated trace is not a sanity failure, while repetition loops
        warn regardless of finish_reason.
      where:
        - "prereg.yaml monitor.warn_rules[5]"
        - "prereg.yaml monitor.probe_configuration"
        - "PREREGISTRATION.md section 4.2"
      why: >-
        The round-8c text deferred these two rules instead of hand-computing
        them, and the code uses optimizer-step boundaries plus a
        length-truncation exception rather than fixed token points or a bare
        missing-answer warning.
      uses_outcome: false
      outcome_basis: >-
        No trained-arm outcome: the exact execution contract of the committed
        monitor implementation.
